<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nostrion-os</title>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,700&display=swap">
<style>
  @font-face{font-family:"Cabinet Grotesk Local";src:url("fonts/CabinetGrotesk-Variable.woff2") format("woff2-variations"),url("fonts/CabinetGrotesk-Variable.woff2") format("woff2");font-weight:100 900;font-display:swap}
  :root{--display:"Cabinet Grotesk Local","Cabinet Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;--bg:#f4f4f5;--card:#fff;--text:#161616;--muted:#8a8a8f;--faint:#b8b8bd;--line:#e9e9ec;--line2:#f2f2f4;--hover:#f7f7f8;--accent:#161616;--chip:#f0f0f2;--hl:#e4f39a;
    --c-blue:#5B7DB1;--c-green:#4E9A78;--c-violet:#8B6FBF;--c-amber:#C9973C;--c-rose:#C96B7E;--c-teal:#4A9BA0;--c-gray:#9A9AA0;--c-tan:#B08A5A;--c-light:#C2C2C7;
    --c-meeting:var(--c-blue);--c-build:var(--c-green);--c-research:var(--c-violet);--c-writing:var(--c-amber);--c-admin:var(--c-gray);--c-learning:var(--c-rose);}
  *{box-sizing:border-box;border-radius:0!important} b,strong{font-weight:500}
  html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Helvetica Neue",Helvetica,Arial,-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
  /* sidebar */
  .side{position:sticky;top:0;height:100vh;padding:22px 20px;border-right:1px solid var(--line);display:flex;flex-direction:column}
  .logo{font-family:var(--display);font-weight:500;font-size:21px;letter-spacing:-.02em;margin:0 0 26px;display:flex;align-items:center;gap:9px}
  .logo i{display:inline-block;width:15px;height:15px;border:4px solid var(--text);border-radius:50%!important}
  .nav a{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;margin:0 -8px;font-size:14px}
  .nav a:hover{background:var(--hover)} .nav a.active{background:#fff;border:1px solid var(--line)}
  .nav a small{color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums}
  .nav .grp{color:var(--faint);font-size:11px;margin:16px 0 4px;letter-spacing:.02em}
  .side .foot{margin-top:auto;color:var(--faint);font-size:11.5px;line-height:1.5;padding-top:14px}
  /* top bar */
  .main{min-width:0}
  .top{display:flex;align-items:center;gap:10px;padding:14px 28px 8px}
  .top .hist{display:flex;gap:4px}
  .top .hist button{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--muted);cursor:pointer;font-size:15px}
  .top .hist button:hover{color:var(--text)}
  .search{position:relative;flex:0 1 520px}
  .search input{width:100%;height:32px;border:1px solid var(--line);padding:0 12px;font:inherit;font-size:13.5px;background:#fff;outline:none}
  .search input:focus{border-color:#c9c9cf}
  .results{position:absolute;top:44px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.08);max-height:70vh;overflow:auto;z-index:20;display:none}
  .results.open{display:block}
  .results a{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:baseline;padding:8px 12px;font-size:13.5px;border-bottom:1px solid var(--line2)}
  .results a:last-child{border-bottom:0} .results a.sel,.results a:hover{background:var(--hover)}
  .results .t{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .results .s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;grid-column:2/4}
  .results .d{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
  .top .date{margin-left:auto;color:var(--muted);font-size:13px}
  /* content */
  .content{padding:14px 28px 60px}
  .card{max-width:1040px} .panel.detail{padding:28px 40px 32px;margin:0}
  .wide .card{max-width:none;padding:0;background:transparent;box-shadow:none}
  .wide h1{margin:4px 0 18px}
  .wide table.grid{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.03);margin:0 0 28px}
  .wide table.grid th:first-child,.wide table.grid td:first-child{padding-left:28px} .wide table.grid th:last-child,.wide table.grid td:last-child{padding-right:28px}
  .wide table.grid thead th{padding-top:18px;padding-bottom:10px} .wide table.grid td{padding-top:11px;padding-bottom:11px}
  .wide table.grid td.wk{padding-top:24px}
  .panel{background:#fff;padding:20px 28px 10px;box-shadow:0 1px 2px rgba(0,0,0,.03);margin-bottom:28px} .panel table.grid{box-shadow:none;margin:0}
  .panel table.grid th:first-child,.panel table.grid td:first-child{padding-left:10px} .panel table.grid th:last-child,.panel table.grid td:last-child{padding-right:10px} .panel table.grid thead th{padding-top:10px}
  .wide .grid-cards{margin-bottom:28px} .wide .stats{margin-top:8px}
  h1{font-family:var(--display);font-size:30px;font-weight:400;letter-spacing:-.02em;margin:0 0 22px;line-height:1.15}
  h1 .sub{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:13px;font-weight:400;color:var(--muted);margin-left:12px;letter-spacing:0}
  h2{font-size:15px;font-weight:500;margin:30px 0 10px} h3{font-size:14px;font-weight:500;margin:20px 0 6px} h4{font-size:14px;font-weight:500;margin:16px 0 6px}
  .crumb{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:12.5px;margin-bottom:10px}

  .fields{display:grid;grid-template-columns:150px 1fr;row-gap:5px;column-gap:20px;margin:0 0 22px;padding-bottom:20px;border-bottom:1px solid var(--line2)}
  .fields dt{color:var(--muted);font-size:13px} .fields dt::first-letter{text-transform:uppercase} .fields dd{margin:0}
  .wl{border-bottom:1px solid transparent} .body p .wl,.body li .wl{border-bottom-color:#dcdce0} .wl:hover{border-bottom-color:var(--text)} .wl.missing{border-bottom:1px dotted var(--faint);color:var(--muted)}
  .body p{margin:0 0 12px} .body ul,.body ol{padding-left:22px;margin:0 0 12px} .body li{margin:3px 0} .body li.task{list-style:none;margin-left:-20px;display:flex;gap:8px;align-items:baseline} .body li.done,.body li.cancelled{color:var(--muted);text-decoration:line-through}
  .box{flex:none;display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border:1px solid #b9b9bf;font-size:10px;line-height:1;color:var(--text);position:relative;top:1px}
  .tmeta{color:var(--muted);font-size:12px;margin-left:6px;white-space:nowrap}
  .pri{display:inline-block;font-size:11.5px;padding:0 6px;border:1px solid var(--line);color:var(--muted);line-height:18px}
  .pri-do{border-color:var(--c-rose);color:var(--c-rose)} .pri-plan{border-color:var(--c-blue);color:var(--c-blue)} .pri-delegate{border-color:var(--c-amber);color:var(--c-amber)}
  .matrix{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:28px} .matrix .panel{margin:0;min-height:120px}
  .matrix .qh{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:2px}
  .matrix .qh b{font-weight:500;font-size:14px} .matrix .qh span{color:var(--muted);font-size:12px}
  .task-row{display:flex;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line2);cursor:pointer} .task-row:last-child{border-bottom:0} .task-row:hover .tt{text-decoration:underline;text-decoration-color:#c9c9cf}
  .task-row .tt{flex:1;min-width:0} .task-row .tm2{display:block;color:var(--muted);font-size:12px;margin-top:2px} .task-row.done .tt{color:var(--muted);text-decoration:line-through}
  .overdue{color:var(--c-rose)!important}
  /* task editing (inside the app only) */
  .editable .box[data-tbox]{cursor:pointer} .editable .box[data-tbox]:hover{border-color:var(--text);background:var(--hover)}
  .tadd{display:inline-flex;align-items:center;height:28px;padding:0 12px;border:1px solid var(--text);background:var(--text);color:#fff;font-size:13px;cursor:pointer;border-radius:6px!important;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0;vertical-align:middle} .tadd:hover{opacity:.85}
  .tadd.sm{height:22px;padding:0 8px;font-size:12px;background:#fff;color:var(--muted);border-color:var(--line);margin-left:10px} .tadd.sm:hover{color:var(--text);border-color:var(--text);opacity:1}
  .tdates{color:var(--faint)} table.grid tr.done td{color:var(--muted)} table.grid tr.done td:nth-child(2){text-decoration:line-through}
  .tmodal{position:fixed;inset:0;background:rgba(22,22,22,.25);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding-top:12vh}
  .tform{background:#fff;width:560px;max-width:calc(100vw - 32px);padding:22px 24px 18px;box-shadow:0 20px 60px rgba(0,0,0,.18);border-radius:10px!important}
  .tform h3{margin:0 0 14px;font-size:15px;font-weight:500;display:flex;justify-content:space-between;align-items:baseline} .tform h3 a{font-size:12.5px;font-weight:400;color:var(--muted);border-bottom:1px solid var(--line)}
  .tform textarea{width:100%;min-height:58px;resize:vertical;font:14px/1.45 inherit;font-family:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px!important;outline:none} .tform textarea:focus,.tform select:focus,.tform input:focus{border-color:var(--text)}
  .tgrid{display:grid;grid-template-columns:90px 1fr;gap:9px 12px;align-items:center;margin:14px 0 4px;font-size:13px} .tgrid > label{color:var(--muted)}
  .tform select,.tform input[type=date]{height:30px;border:1px solid var(--line);border-radius:6px!important;background:#fff;font:inherit;font-size:13px;padding:0 8px;outline:none;max-width:100%}
  .tseg{display:inline-flex;border:1px solid var(--line);border-radius:6px!important;overflow:hidden} .tseg span{padding:5px 11px;cursor:pointer;color:var(--muted);font-size:12.5px;border-right:1px solid var(--line)} .tseg span:last-child{border-right:0} .tseg span:hover{color:var(--text)} .tseg span.on{background:var(--text);color:#fff}
  .tppl{display:flex;flex-wrap:wrap;gap:6px;align-items:center} .tppl .pchip{display:inline-flex;gap:6px;align-items:center;padding:3px 8px;background:var(--chip);font-size:12.5px;border-radius:4px!important} .tppl .pchip b{font-weight:400;cursor:pointer;color:var(--muted)} .tppl .pchip b:hover{color:var(--text)}
  .tfoot{display:flex;align-items:center;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line2);font-size:12.5px;color:var(--muted)} .tfoot .sp{margin-left:auto}
  .tfoot button{height:30px;padding:0 14px;border:1px solid var(--line);background:#fff;border-radius:6px!important;font:inherit;font-size:13px;cursor:pointer;color:var(--text)} .tfoot button.pri{background:var(--text);color:#fff;border-color:var(--text)}
  .ttoast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;font-size:13px;padding:8px 14px;border-radius:8px!important;z-index:120}
  .indent{padding-left:20px!important;color:#444} .indent::before{content:"└ ";color:var(--faint)}
  @media (max-width:900px){.matrix{grid-template-columns:1fr}}
  .body h2,.body h3{margin-top:26px} .body blockquote{margin:0 0 12px;padding:2px 14px;border-left:3px solid var(--line);color:#555}
  .body code,code{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--chip);padding:1px 5px;border-radius:4px}
  .body pre{background:#f7f7f8;padding:14px;border-radius:8px;overflow:auto;font-size:13px} .body pre code{background:none;padding:0}
  .body table,table.grid{border-collapse:collapse;width:100%;margin:0 0 16px;font-size:13.5px}
  .body th,.body td,table.grid th,table.grid td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
  .body th,table.grid th{color:var(--muted);font-weight:400;font-size:12.5px;border-bottom:1px solid var(--line)}
  table.grid td.num,table.grid th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  table.grid tr.row:hover td{background:var(--hover);cursor:pointer}
  table.grid td.muted,.muted{color:var(--muted)} .faint{color:var(--faint)}
  table.grid .strong{font-weight:500}
  .body img{max-width:100%;border-radius:8px}
  .tag{color:var(--muted);font-size:13px}
  /* chips */
  .chips{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0 0 14px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;font-size:13px;color:#444;cursor:pointer;border:1px solid transparent}
  .chip:hover{background:var(--hover)} .chip.on{background:var(--text);color:#fff} .chip.on.hl{background:var(--hl);color:var(--text)}
  .chip small{color:inherit;opacity:.55;font-size:11.5px} .chip.zero{opacity:.45}
  /* filter bar: one dropdown button per group; plain when the group is not narrowed, dark with a summary when it is */
  .fbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 18px}
  .frow{display:flex;flex-wrap:wrap;align-items:center;gap:3px 4px;padding:2px 0}
  .flabel{flex:none;width:92px;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
  .fgrp{position:relative}
  .fbtn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--muted);cursor:pointer;border-radius:6px;user-select:none;white-space:nowrap}
  .fbtn:hover{border-color:#c4c4ca;color:var(--text)} .fbtn .car{font-size:9px;color:var(--faint)} .fbtn b{font-weight:500;color:var(--text)}
  .fbtn.on{background:var(--text);color:rgba(255,255,255,.65);border-color:var(--text)} .fbtn.on b{color:#fff} .fbtn.on .car{color:rgba(255,255,255,.5)}
  .fbtn.def{border-style:dashed;color:var(--muted)} .fbtn.def b{color:#555;font-weight:400}
  .fgrp.open .fbtn{border-color:var(--text);color:var(--text)}
  .fpop{position:absolute;top:100%;left:0;margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.09);padding:6px;min-width:210px;max-width:320px;max-height:340px;overflow:auto;z-index:40}
  .fopt{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:5px;cursor:pointer;font-size:13px;color:#333;user-select:none} .fopt:hover{background:var(--hover)} .fopt.zero{opacity:.45}
  .fopt .ck{width:14px;height:14px;border:1px solid #b9b9bf;border-radius:3px;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:10px;line-height:1;color:#fff} .fopt.on .ck{background:var(--text);border-color:var(--text)}
  .fopt small{margin-left:auto;padding-left:14px;color:var(--muted);font-variant-numeric:tabular-nums} .fopt .cat{font-size:13px;color:inherit}

  .fhint{padding:6px 8px 2px;font-size:11.5px;color:var(--faint)}

  .fopt:hover .only{display:inline-block} .fopt:hover .only + small{margin-left:0;padding-left:8px}
  .freset{font-size:12.5px;color:var(--muted);cursor:pointer;border-bottom:1px solid var(--line);margin-left:4px} .freset:hover{color:var(--text)}
  /* sortable, aligned tables */
  table.grid.fx col{min-width:40px} table.grid.fx td.strong{min-width:160px}
  th.sortable{cursor:pointer;user-select:none;white-space:nowrap} th.sortable:hover{color:var(--text)} th.sortable.sorted{color:var(--text)}
  th .arr{display:inline-block;width:12px;font-size:9px;margin-left:3px;color:var(--text);vertical-align:1px}
  tr.grp td{padding:22px 10px 4px;color:var(--muted);font-size:12.5px;border-bottom:1px solid var(--line)} tr.grp:first-child td{padding-top:6px}
  tr.row.dim td{color:var(--muted)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%!important;background:var(--dot,var(--faint));flex:none}
  .cat-framework .dot{background:var(--c-teal)} .cat-brief .dot{background:var(--c-blue)} .cat-report .dot{background:var(--c-amber)} .cat-tool .dot{background:var(--c-green)} .cat-reference .dot{background:var(--c-gray)} .cat-post .dot{background:var(--c-tan)} .cat-note .dot{background:var(--c-light)}
  .cat-meeting .dot{background:var(--c-meeting)} .cat-build .dot{background:var(--c-build)} .cat-research .dot{background:var(--c-research)} .cat-writing .dot{background:var(--c-writing)} .cat-admin .dot{background:var(--c-admin)} .cat-learning .dot{background:var(--c-learning)}
  .cat{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:#555}
  .toolbar{display:flex;gap:10px;align-items:center;margin:0 0 14px;flex-wrap:wrap} .toolbar .sp{flex:1}
  .toolbar input,.toolbar select{height:30px;border:1px solid var(--line);padding:0 10px;font:inherit;font-size:13px;background:#fff}
  /* entries */
  .entry{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:16px 0;border-bottom:1px solid var(--line2)}
  .entry:last-child{border-bottom:0}
  .entry .tm{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;padding-top:2px}
  .entry .ttl{display:flex;justify-content:space-between;gap:16px;font-weight:500;font-size:14.5px;margin-bottom:2px} .entry .ttl .h{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}
  .entry .meta{font-size:12.5px;color:var(--muted);margin-bottom:8px} .entry .meta .wl{border-bottom:0;color:var(--muted)} .entry .meta .wl:hover{color:var(--text)}
  .entry .meta .h{font-variant-numeric:tabular-nums;color:var(--text)}
  .entry .notes{color:#333;font-size:14px} .entry .notes p:last-child{margin-bottom:0}
  .entry .day{color:var(--muted)}
  .timeline .entry{grid-template-columns:100px 1fr} .entry.nocol{grid-template-columns:1fr}
  .daynav{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin:-6px 0 20px} .daynav a{border-bottom:1px solid var(--line)}

  td.wkcell{color:var(--faint);font-size:12px;white-space:nowrap} tr.row:hover td.wkcell{color:var(--muted)}

  td.work .snip{color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  .two{display:grid;grid-template-columns:2fr 1fr;gap:28px;align-items:start} @media (max-width:1100px){.two{grid-template-columns:1fr}}
  .panel h2{margin:0 0 10px;font-size:14.5px} .bar{display:inline-block;width:110px;height:5px;background:var(--line);border-radius:3px;vertical-align:middle;margin-right:8px;overflow:hidden} .bar i{display:block;height:100%;background:var(--hl)} .pct{color:var(--muted);font-size:13px}

  .people-list a,.list a{display:inline}

  .acard{border:1px solid var(--line);background:#fff;cursor:pointer} .acard:hover{border-color:#c9c9cf}
  .acard .th{height:170px;background:var(--chip);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font:13px ui-monospace,Menlo,monospace}
  .acard .th img{width:100%;height:100%;object-fit:cover;display:block}
  .acard .cap{padding:10px 12px 12px} .acard .cap b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .acard .cap span{color:var(--muted);font-size:12.5px}
  .more{color:var(--muted);font-size:13px}

  /* detail pages: one section rhythm */
  .panel.detail h2{margin:0}
  .sec{margin-top:34px} .sec:first-child{margin-top:0}
  .sec > h2{font-size:14px;font-weight:500;margin:0 0 4px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .sec > h2 .n{color:var(--muted);font-weight:400;margin-left:6px}
  .panel.detail table.grid{margin:0}
  .panel.detail table.grid td{padding:10px 12px;border-bottom:1px solid var(--line2)}
  .panel.detail table.grid td:first-child{padding-left:0} .panel.detail table.grid td:last-child{padding-right:0}
  .panel.detail .timeline .entry{padding:14px 0}
  .panel.detail .entry:last-child{border-bottom:0}
  .panel.detail .body{margin-top:4px}
  .panel.detail .fields{border-bottom:0;padding-bottom:0;margin-bottom:0}
  .ext::after{content:" ↗";color:var(--faint);font-size:12px}
  .pub{white-space:nowrap;font-size:13px} .pub.ok{color:#2e7d4f} .pub.warn{color:#b4740f;font-weight:600}
  .mini{display:inline-block;margin-left:6px;padding:1px 7px;font-size:12px;color:#444;background:var(--chip);border-radius:4px;cursor:pointer;vertical-align:1px} .mini:hover{background:var(--text);color:#fff}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:#fff;font-size:13px;padding:8px 14px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50} #toast.on{opacity:1}
  @media (max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.card{padding:24px 20px}.top{padding:12px 16px}.content{padding:8px 16px 40px}.fields{grid-template-columns:120px 1fr}}
</style>

<body>
<script>/*__DATA__*/</script>
<div class="app">
  <aside class="side">
    <div class="logo"><i></i>Nostrion-os</div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="foot"></div>
  </aside>
  <div class="main">
    <div class="top">
      <div class="hist"><button onclick="history.back()" title="back">←</button><button onclick="history.forward()" title="forward">→</button></div>
      <div class="search"><input id="q" type="search" placeholder="Search days, people, projects, documents, assets…  ( / )" autocomplete="off"><div class="results" id="results"></div></div>
      <div class="date" id="topdate"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<script>
(() => {
const D = window.YCOS; if (!D) { document.getElementById('content').innerHTML = '<div class="card">No data. Run <code>node app/build.mjs</code>.</div>'; return; }
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const by = { person: new Map(D.people.map(x=>[x.id,x])), project: new Map(D.projects.map(x=>[x.id,x])), doc: new Map(D.docs.map(x=>[x.id,x])), asset: new Map(D.assets.map(x=>[x.id,x])), day: new Map(D.days.map(x=>[x.id,x])) };
const entries = new Map(); for (const d of D.days) for (const e of d.entries) entries.set(e.id, e);
const fmtDate = (s, opts) => { if (!s) return ''; const d = new Date(s + 'T00:00:00'); return d.toLocaleDateString('en-US', opts || { weekday:'short', day:'numeric', month:'short', year:'numeric' }); };
const wd = (s) => new Date(s+'T00:00:00').toLocaleDateString('en-US',{weekday:'short'});
const month = (s) => new Date(s.slice(0,7)+'-01T00:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'});
const h = (n) => n == null ? '' : (Math.round(n*100)/100) + 'h';
const obs = (file) => `obsidian://open?vault=${encodeURIComponent(D.vault)}&file=${encodeURIComponent(file.replace(/\.md$/,''))}`;
const fileHref = (rel) => '../' + rel.split('/').map(encodeURIComponent).join('/');
const link = (type, id, label) => { const x = by[type] && by[type].get(id); return x ? `<a class="wl" href="#/${type}/${id}">${esc(label || x.name)}</a>` : `<span class="wl missing">${esc(label || id)}</span>`; };
const links = (type, ids) => ids.map(id => link(type, id)).join('<span class="sep">·</span>');
// a category the CSS does not know (a new document type, a new log category) still gets a stable colour, derived from its name
const DOT_PALETTE = ['--c-blue','--c-green','--c-violet','--c-amber','--c-rose','--c-teal','--c-tan'];
const KNOWN_CATS = new Set(['meeting','build','research','writing','admin','learning','framework','brief','report','tool','reference','post','note']);
const dotStyle = (c) => { if (!c || KNOWN_CATS.has(c)) return ''; let h = 0; for (const ch of String(c)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return ` style="--dot:var(${DOT_PALETTE[h % DOT_PALETTE.length]})"`; };
const catHtml = (c) => c ? `<span class="cat cat-${esc(c)}"${dotStyle(c)}><span class="dot"></span>${esc(c)}</span>` : '';
const backlinksOf = (type, id) => (D.backlinks[`${type}/${id}`] || []);
const setTitle = (t) => document.title = t ? `${t} — Nostrion-os` : 'Nostrion-os';

// ---------- nav ----------
const NAV = [
  ['today','Today',''], ['grp','Log'], ['journal','Daily Log', D.days.length], ['tasks','Tasks', D.tasks.filter(t=>t.status==='open'||t.status==='doing').length||''], ['hours','Hours', D.totals.hours], ['grp','Vault'],
  ['projects','Projects',''], ['people','People',''], ['library','Library',''], ['assets','Assets',''],
];
function renderNav(active) {
  $('#nav').innerHTML = NAV.map(([k,l,c]) => k==='grp' ? `<div class="grp">${l}</div>` : `<a href="#/${k}" class="${active===k?'active':''}">${l}<small>${c===''?'':c}</small></a>`).join('');
  const native = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.ycos;
  $('#foot').innerHTML = `built ${D.generated.slice(11,16)} UTC<br>${native?`<a href="#rebuild" id="rebuild" style="border-bottom:1px solid var(--line)">↻ rebuild</a> · `:''}<a href="#/readme" style="border-bottom:1px solid var(--line)">README</a>`;
  if (native) $('#rebuild').addEventListener('click', ev => { ev.preventDefault(); native.postMessage({ rebuild: true }); });
}
$('#topdate').textContent = new Date().toLocaleDateString('en-US',{weekday:'short',day:'numeric',month:'short',year:'numeric'});

// ---------- pieces ----------
function crumb(back, file, right) { return `<div class="crumb"><a class="back" href="javascript:history.back()">Back</a>${file?`<code>${esc(file)}</code>`:''}<span class="right">${file?`<a href="${obs(file)}">edit in Obsidian</a>`:''}${right||''}</span></div>`; }
function entryHtml(e, showDay) {
  const meta = [];
  if (e.project) meta.push(link('project', e.project)); else if (e.projectName) meta.push(`<span class="wl missing">${esc(e.projectName)}</span>`);
  if (e.category) meta.push(esc(e.category));
  if (e.people.length) meta.push(e.people.map(id => link('person', id)).join(', '));
  if (e.docs && e.docs.length) meta.push(links('doc', e.docs));
  if (e.assets && e.assets.length) meta.push(links('asset', e.assets));
  const left = showDay ? `<div class="tm"><a class="day" href="#/day/${e.date}">${e.date}</a></div>` : '';
  return `<div class="entry ${showDay?'':'nocol'}" id="e-${e.id}">${left}<div><div class="ttl"><span>${esc(e.title)}</span>${e.hours != null ? `<span class="h">${h(e.hours)}</span>` : ''}</div>${meta.length?`<div class="meta">${meta.join('<span class="sep">·</span>')}</div>`:''}${e.notesHtml?`<div class="notes body">${e.notesHtml}</div>`:''}</div></div>`;
}
const sec = (title, n, inner) => `<section class="sec"><h2>${title}${n!=null?`<span class="n">${n}</span>`:''}</h2>${inner}</section>`;
function timeline(ids, title) {
  if (!ids.length) return '';
  return sec(title, ids.length, `<div class="timeline">${ids.map(id => entryHtml(entries.get(id), true)).join('')}</div>`);
}
function backlinksHtml(type, id) {
  const b = backlinksOf(type, id).filter(x => x.type !== 'day'); if (!b.length) return '';
  return sec('Linked from', b.length, `<table class="grid"><tbody>${b.map(x => `<tr class="row" onclick="location.hash='#/${x.type}/${x.id}'"><td class="muted" style="width:110px">${x.type}</td><td>${esc(x.label)}</td></tr>`).join('')}</tbody></table>`);
}
function peopleShort(ids, max=3) {
  const shown = ids.slice(0,max).map(id => link('person', id)).join('<span class="sep">·</span>');
  return shown + (ids.length>max ? `<span class="more"> +${ids.length-max}</span>` : '');
}
function dayRowHtml(d, wk) {
  return `<tr class="row" onclick="location.hash='#/day/${d.id}'"><td class="wkcell">${wk||''}</td><td class="daycell" style="width:130px"><b>${fmtDate(d.date,{weekday:'short',month:'short',day:'numeric'})}</b></td><td>${d.projects.length?links('project',d.projects):`<span class="muted">${d.entries.length?d.entries.length+' entr'+(d.entries.length===1?'y':'ies'):'no entries'}</span>`}</td><td class="muted" style="width:30%">${peopleShort(d.people)}</td><td class="num">${d.hours?h(d.hours):''}</td></tr>`;
}
function emptyHtml(what, how) { return `<div class="empty">No ${what} yet. ${how}</div>`; }

// ---------- shared filters + sortable tables ----------
// Every list page uses the same pieces: fstate() keeps the page's filter/sort state (persisted, so a rebuild-reload keeps it),
// makeFilter() renders one toggle row per group with live counts, tableHtml() renders one aligned table with sortable headers.
const FS = (() => { try { return JSON.parse(localStorage.getItem('ycos.filters') || '{}'); } catch (e) { return {}; } })();
const saveFS = () => { try { localStorage.setItem('ycos.filters', JSON.stringify(FS)); } catch (e) {} };
const fstate = (page, defaults) => { const st = FS[page] = Object.assign({}, defaults, FS[page] || {}); if (!st.sel || typeof st.sel !== 'object') st.sel = {}; if (!st.off || typeof st.off !== 'object') st.off = {}; if (!st.sort) st.sort = defaults.sort; st._page = page; st._defaults = defaults; return st; };
const asList = (v) => v == null || v === '' ? [] : Array.isArray(v) ? v : [v];
// groups: {k, label, get(item) → value | values, order?, defaultOff? (values hidden until toggled on), none? (label for items without a value), labelOf?, dot? (v → category class)}
function makeFilter(st, groups, items) {
  for (const g of groups) {
    const seen = new Map(); let empties = 0;
    for (const it of items) { const vs = asList(g.get(it)); if (!vs.length) empties++; for (const v of vs) if (!seen.has(v)) seen.set(v, { v, l: g.labelOf ? g.labelOf(v) : String(v) }); }
    if (g.none && empties) seen.set('', { v: '', l: g.none });
    g._vals = [...seen.values()].sort((a, b) => { const o = g.order || []; const ia = a.v === '' ? 998 : o.indexOf(a.v), ib = b.v === '' ? 998 : o.indexOf(b.v); return (ia < 0 ? 500 : ia) - (ib < 0 ? 500 : ib) || String(a.l).localeCompare(String(b.l)); });
    g._all = g._vals.map(x => x.v);
    g._def = g._all.filter(v => !(g.defaultOff || []).includes(v));
    // a narrowed group is stored as the values it HIDES (st.off), so a value that appears later (a new category, a new project) is shown by default
    if (st.sel && g.k in st.sel) { delete st.sel[g.k]; saveFS(); } // old allowlist form (hid anything new): drop it once, back to defaults
    const off = Array.isArray(st.off[g.k]) ? st.off[g.k] : (g.defaultOff || []);
    g._sel = g._all.filter(v => !off.includes(v));
    g._isAll = g._sel.length === g._all.length;
    g._dirty = g._sel.length !== g._def.length || g._sel.some(v => !g._def.includes(v));
    g._has = (it, v) => { const vs = asList(g.get(it)); return v === '' ? !vs.length : vs.includes(v); };
    g._pass = (it) => { if (g._isAll) return true; const vs = asList(g.get(it)); if (!vs.length) return g.none ? g._sel.includes('') : true; return vs.some(v => g._sel.includes(v)); };
  }
  const passExcept = (it, skip) => groups.every(g => g === skip || g._pass(it));
  const pass = (it) => groups.every(g => g._pass(it));
  const shown = groups.filter(g => g._vals.length > 1 || g._dirty || (g.defaultOff || []).some(v => g._all.includes(v)));
  const opt = (g, x) => { const n = items.filter(it => passExcept(it, g) && g._has(it, x.v)).length; const on = g._sel.includes(x.v); const dot = x.v !== '' && g.dot ? g.dot(x.v) : '';
    return `<div class="fopt ${on ? 'on' : ''} ${n ? '' : 'zero'}" data-g="${esc(g.k)}" data-v="${esc(x.v)}" title="${on ? 'Hide ' + esc(x.l) : 'Show ' + esc(x.l)} · Alt-click: only ${esc(x.l)}"><span class="ck">${on ? '✓' : ''}</span>${dot ? `<span class="cat cat-${esc(dot)}"${dotStyle(dot)}><span class="dot"></span></span>` : ''}<span>${esc(x.l)}</span><span class="only" data-only="1" title="Show only ${esc(x.l)}">only</span><small>${n}</small></div>`; };
  const summary = (g) => { // what the button says when the group is narrowed
    const sel = g._vals.filter(x => g._sel.includes(x.v)), off = g._vals.filter(x => !g._sel.includes(x.v));
    if (!sel.length) return 'none';
    if (off.length && off.length <= 2 && off.length <= sel.length) return 'without ' + off.map(x => x.l).join(', ');
    return sel.length <= 2 ? sel.map(x => x.l).join(', ') : sel.length + ' of ' + g._vals.length; };
  const btn = (g) => { const open = P._fopen === g.k; const cls = g._isAll ? '' : g._dirty ? 'on' : 'def';
    return `<span class="fgrp ${open ? 'open' : ''}"><span class="fbtn ${cls}" data-g="${esc(g.k)}" data-open="1" title="${g._isAll ? 'Filter by ' + esc(g.label) : 'Filtered · click to change'}">${esc(g.label)}${g._isAll ? '' : ` <b>${esc(summary(g))}</b>`}<span class="car">▼</span></span>${open ? `<div class="fpop"><div class="fopt all ${g._isAll || g._sel.length ? 'on' : ''}" data-g="${esc(g.k)}" data-v="*" title="${g._isAll ? 'Hide all' : 'Show all'}"><span class="ck">${g._isAll ? '✓' : g._sel.length ? '–' : ''}</span><span>all</span><small>${items.filter(it => passExcept(it, g)).length}</small></div>${g._vals.map(x => opt(g, x)).join('')}<div class="fhint">Click to show or hide · “only” for just one</div></div>` : ''}</span>`; };
  const dirty = groups.some(g => g._dirty) || (st._defaults.sort && (st.sort.k !== st._defaults.sort.k || st.sort.d !== st._defaults.sort.d));
  const html = shown.length || dirty ? `<div class="fbar">${shown.map(btn).join('')}${dirty ? `<span class="freset" data-reset="1">↺ reset</span>` : ''}</div>` : '';
  P._groups = groups;
  return { html, pass, dirty, n: items.filter(pass).length };
}
const cmpVal = (a, b) => { const ea = a == null || a === '', eb = b == null || b === ''; if (ea || eb) return ea && eb ? 0 : ea ? 1 : -1; return typeof a === 'number' && typeof b === 'number' ? a - b : String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' }); };
function sortRows(rows, cols, sort, tie) { const c = cols.find(x => x.k === sort.k) || cols[0]; const dir = sort.d === 'desc' ? -1 : 1;
  return rows.slice().sort((a, b) => { const va = c.v(a), vb = c.v(b); const ea = va == null || va === '', eb = vb == null || vb === ''; if (ea !== eb) return ea ? 1 : -1; return dir * cmpVal(va, vb) || (tie ? tie(a, b) : 0); }); }
// cols: {k, l, w?, num?, cls?, v(row) → sort value, r(row) → cell html, dd? default direction}; opts: {href(row), group:{keys, of(row), label(key)}, rowCls(row), empty}
function tableHtml(cols, rows, sort, opts = {}) {
  const head = cols.map(c => { const on = sort.k === c.k; return `<th class="sortable ${on ? 'sorted' : ''} ${c.num ? 'num' : ''}" data-k="${c.k}" data-d="${c.dd || (c.num ? 'desc' : 'asc')}" title="Sort by ${esc(c.l)}">${esc(c.l)}<span class="arr">${on ? (sort.d === 'asc' ? '▲' : '▼') : ''}</span></th>`; }).join('');
  let body = '', cur = null; const grouping = opts.group && opts.group.keys.includes(sort.k);
  for (const r of rows) {
    if (grouping) { const gk = opts.group.of(r); if (gk !== cur) { cur = gk; body += `<tr class="grp"><td colspan="${cols.length}">${esc(opts.group.label(gk))}</td></tr>`; } }
    body += `<tr class="row ${opts.rowCls ? opts.rowCls(r) : ''}" ${opts.href ? `onclick="location.hash='${opts.href(r)}'"` : ''} ${opts.attr ? opts.attr(r) : ''}>${cols.map(c => `<td class="${c.num ? 'num' : ''} ${typeof c.cls === 'function' ? c.cls(r) : c.cls || ''}" ${typeof c.style === 'function' ? `style="${c.style(r)}"` : ''}>${c.r(r)}</td>`).join('')}</tr>`;
  }
  return `<table class="grid fx"><colgroup>${cols.map(c => c.w ? `<col style="width:${c.w}">` : '<col>').join('')}</colgroup><thead><tr>${head}</tr></thead><tbody>${body || `<tr><td colspan="${cols.length}" class="muted">${opts.empty || 'Nothing matches these filters.'}</td></tr>`}</tbody></table>`;
}
function bindList(st, extra) { // chip toggles, reset, sortable headers, optional mode chips (data-k/data-v) handled by `extra`
  const c = $('#content');
  c.querySelectorAll('.fbar').forEach(bar => bar.addEventListener('click', ev => {
    if (ev.target.closest('[data-reset]')) { st.sel = {}; st.off = {}; st.sort = st._defaults.sort; P._fopen = null; saveFS(); route(); return; }
    const b = ev.target.closest('.fbtn[data-open]'); if (b) { P._fopen = P._fopen === b.dataset.g ? null : b.dataset.g; route(); return; }
    const ch = ev.target.closest('.fopt[data-g]'); if (!ch) return; const g = ch.dataset.g, v = ch.dataset.v; const G = (P._groups || []).find(x => x.k === g); if (!G) return;
    const hide = (sel) => { st.off[g] = G._all.filter(x => !sel.includes(x)); };
    // a checkbox is a checkbox: a click toggles that value; "only" (or Alt-click) shows just that one; "all" ticks everything, or nothing when all are ticked
    if (v === '*') st.off[g] = G._isAll ? G._all.slice() : [];
    else if (ev.target.closest('[data-only]') || ev.altKey) hide([v]);
    else { const cur = G._sel.slice(); const i = cur.indexOf(v); if (i >= 0) cur.splice(i, 1); else cur.push(v); hide(cur); }
    saveFS(); route();
  }));
  c.querySelectorAll('th.sortable').forEach(th => th.addEventListener('click', () => { const k = th.dataset.k; st.sort = st.sort && st.sort.k === k ? { k, d: st.sort.d === 'asc' ? 'desc' : 'asc' } : { k, d: th.dataset.d || 'asc' }; saveFS(); route(); }));
  c.querySelectorAll('.modes').forEach(m => m.addEventListener('click', ev => { const ch = ev.target.closest('.chip[data-k]'); if (!ch) return; st[ch.dataset.k] = ch.dataset.v; saveFS(); route(); }));
  if (extra) extra();
}
document.addEventListener('click', ev => { if (P._fopen && !ev.target.closest('.fgrp')) { P._fopen = null; route(); } }); // click outside closes a filter popover
const modeChips = (st, k, options) => `<span class="chips modes" style="margin:0">${options.map(([v, l]) => `<span class="chip ${st[k] === v ? 'on' : ''}" data-k="${k}" data-v="${esc(v)}">${esc(l)}</span>`).join('')}</span>`;
const projName = (id) => (by.project.get(id) || {}).name || id;
const personName = (id) => (by.person.get(id) || {}).name || id;

// ---------- pages ----------
const P = {};
const taskMap = new Map(D.tasks.map(t=>[t.id,t]));
const PRI = { do:['Do','urgent · important'], plan:['Plan','important · not urgent'], delegate:['Delegate','urgent · not important'], later:['Later','not urgent · not important'] };
const priHtml = (p) => p ? `<span class="pri pri-${p}">${PRI[p][0]}</span>` : '';
const isOpen = (t) => t.status==='open' || t.status==='doing';
const NATIVE = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.ycos; // inside the app: tasks can be changed
const md = (s) => fmtDate(s,{month:'short',day:'numeric'});
const taskSrc = (t) => t.entry ? `#/day/${t.date}` : `#/project/${t.source}`;
const taskBox = (t) => `<span class="box" ${NATIVE?`data-tbox="${t.id}" title="${isOpen(t)?'Mark done':'Reopen'}"`:''}>${t.status==='done' ? '✓' : t.status==='doing' ? '◐' : t.status==='cancelled' ? '×' : ''}</span>`;
const taskDates = (t) => { // "added Oct 6 · done Oct 8 (2d)"
  const out = [`added ${md(t.added || t.date)}`];
  if (t.status==='done' || t.status==='cancelled') out.push(t.done ? `${t.status} ${md(t.done)}${t.days!=null?` (${t.days}d)`:''}` : t.doneUnknown ? `${t.status}, date unknown` : t.status);
  return `<span class="tdates">${out.join(' · ')}</span>`; };
const taskPeople = (t) => t.people.filter(id => id !== t.waiting && !t.textHtml.includes(`#/person/${id}"`));
function taskRow(t, opts={}) {
  const overdue = isOpen(t) && t.due && t.due < D.today;
  const meta = [];
  if (!opts.noProject && t.project) meta.push(esc(by.project.get(t.project).name));
  if (t.waiting) meta.push('waiting on ' + esc(by.person.get(t.waiting).name));

};
P.assets = () => {
  const st = fstate('assets', { sort: { k: 'edited', d: 'desc' } });
  const groups = [
    { k: 'ext', label: 'type', get: a => a.ext, none: 'no extension' },
    { k: 'proj', label: 'project', get: a => a.project, labelOf: projName, none: 'no project' },
  ];
  const F = makeFilter(st, groups, D.assets);
  const sorts = [['edited', 'newest'], ['name', 'name'], ['size', 'largest']];
  const rows = D.assets.filter(F.pass).sort((a, b) => st.sort.k === 'name' ? a.name.localeCompare(b.name) : st.sort.k === 'size' ? b.size - a.size : b.edited.localeCompare(a.edited) || a.name.localeCompare(b.name));
  const isImg = (a) => ['png','jpg','jpeg','gif','webp','svg'].includes(a.ext);
  return { title:'Assets', wide:true, html:`<h1>Assets<span class="sub">${rows.length} of ${D.assets.length} · files that are not documents</span></h1><div class="fbar">${F.html.replace(/^<div class="fbar">|<\/div>$/g, '')}<span class="muted" style="font-size:12.5px;margin-left:auto">sort</span><span class="chips modes" style="margin:0">${sorts.map(([k, l]) => `<span class="chip ${st.sort.k === k ? 'on' : ''}" data-sort="${k}">${l}</span>`).join('')}</span></div>
    ${rows.length?`<div class="grid-cards">${rows.map(a=>`<div class="acard" onclick="location.hash='#/asset/${a.id}'"><div class="th">${isImg(a)?`<img src="${fileHref(a.file)}" alt="">`:esc(a.ext)}</div><div class="cap"><b>${esc(a.name)}</b><span>${esc(a.ext)}${a.project?' · '+esc(projName(a.project)):''} · ${a.edited}</span></div></div>`).join('')}</div>`:D.assets.length?'<div class="empty">Nothing matches these filters.</div>':emptyHtml('assets','Drop any file in <code>Assets/</code>. Add <code>name.md</code> next to it for notes and links.')}`,
    after: () => bindList(st, () => $('#content').querySelectorAll('[data-sort]').forEach(c => c.addEventListener('click', () => { st.sort = { k: c.dataset.sort, d: 'desc' }; saveFS(); route(); }))) };
};
P.asset = (id) => {
  const a = by.asset.get(id); if (!a) return notFound('asset', id);
  const isImg = ['png','jpg','jpeg','gif','webp','svg'].includes(a.ext);
  return { title:a.name, html:`${crumb(true, a.sidecar)}<h1>${esc(a.name)}</h1>
    <dl class="fields"><dt>file</dt><dd><a class="wl ext" href="${fileHref(a.file)}" target="_blank">${esc(a.file)}</a></dd><dt>type</dt><dd>${esc(a.ext)}</dd><dt>size</dt><dd>${a.size>1e6?(a.size/1e6).toFixed(1)+' MB':Math.round(a.size/1e3)+' KB'}</dd><dt>modified</dt><dd>${a.edited}</dd>${a.project?`<dt>project</dt><dd>${link('project',a.project)}</dd>`:''}${a.tags.length?`<dt>tags</dt><dd>${a.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join(' ')}</dd>`:''}</dl>
    ${isImg?`<p><img src="${fileHref(a.file)}" style="max-width:100%;border-radius:8px"></p>`:''}${a.bodyHtml?`<div class="body">${a.bodyHtml}</div>`:''}
    ${timeline(backlinksOf('asset',id).filter(b=>b.type==='day').map(b=>b.entry),'Mentioned in log')}${backlinksHtml('asset',id)}` };
};
P.readme = () => ({ title:'README', html:`${crumb(true,'README.md')}<div class="body">${D.readme}</div>` });
function notFound(type, id) { return { title:'Not found', html:`${crumb(true)}<h1>Not found</h1><div class="empty">No ${type} with id <code>${esc(id)}</code>. Rebuild the hub if you just added it.</div>` }; }

// ---------- router ----------
function route() {
  const hash = location.hash.replace(/^#\/?/, '') || 'today'; const [page, ...rest] = hash.split('/'); const id = decodeURIComponent(rest.join('/'));
  if (page === 'doc') { const d = by.doc.get(id); if (d && d.open && !d.bodyHtml) {
    // HTML document: leave the hub on the page we came from (not on #/doc/…, which would redirect again on Back), then open the file as a new history entry
    history.replaceState(null, '', P._lastHash || '#/library'); location.href = fileHref(d.open); return; } }
  const fn = P[page] || P.today; const r = fn(id);
  const navKey = { day:'journal', project:'projects', person:'people', doc:'library', asset:'assets' }[page] || page;
  renderNav(navKey); setTitle(r.title);
  const c = $('#content'); c.className = 'content' + (r.wide ? ' wide' : '');
  let html = r.html; if (!r.wide) { const i = html.indexOf('</h1>'); html = i >= 0 ? html.slice(0, i+5) + '<div class="panel detail">' + html.slice(i+5) + '</div>' : `<div class="panel detail">${html}</div>`; }
  c.innerHTML = `<div class="card">${html}</div>`;
  if (r.after) r.after();
  const same = P._lastHash === location.hash; if (!same) P._fopen = null; P._lastHash = location.hash;
  if (!same) window.scrollTo(0, 0); // filters re-render the same page without jumping
}
window.addEventListener('hashchange', route);

// ---------- search ----------
const idx = [
  ...D.days.map(d=>({type:'day',id:d.id,name:d.date,sub:d.entries.map(e=>e.title).join(' · '),text:d.text,date:d.date})),
  ...D.people.map(p=>({type:'person',id:p.id,name:p.name,sub:[p.role,p.organization].filter(Boolean).join(' · '),text:p.text,date:p.lastContact})),
  ...D.projects.map(p=>({type:'project',id:p.id,name:p.name,sub:p.description,text:p.text,date:p.lastActivity})),
  ...D.docs.map(d=>({type:'doc',id:d.id,name:d.name,sub:d.category+(d.project?' · '+(by.project.get(d.project)||{}).name:''),text:d.text,date:d.edited})),
  ...D.assets.map(a=>({type:'asset',id:a.id,name:a.name,sub:a.ext,text:a.text,date:a.edited})),
  ...D.tasks.map(t=>({type:'task',id:t.id,name:t.search,sub:[t.project?(by.project.get(t.project)||{}).name:'', t.status, t.priority].filter(Boolean).join(' · '),text:t.search,date:t.date,day:t.date,src:t.source})),
  ...[...entries.values()].map(e=>({type:'entry',id:e.id,name:e.title,sub:[e.date, e.projectName, e.category].filter(Boolean).join(' · '),text:e.text,date:e.date,day:e.date})),
];
const q = $('#q'), res = $('#results'); let sel = 0, hits = [];
function search(s) {
  s = s.trim().toLowerCase(); if (!s) { res.classList.remove('open'); res.innerHTML=''; hits=[]; return; }
  const terms = s.split(/\s+/);
  hits = idx.map(it => { const n = it.name.toLowerCase(), sub=(it.sub||'').toLowerCase(), t=(it.text||'').toLowerCase(); let score=0;
    for (const term of terms) { if (n===term) score+=50; else if (n.startsWith(term)) score+=25; else if (n.includes(term)) score+=15; else if (sub.includes(term)) score+=8; else if (t.includes(term)) score+=3; else return null; }
    return {it, score}; }).filter(Boolean).sort((a,b)=>b.score-a.score||(b.it.date||'').localeCompare(a.it.date||'')).slice(0,30).map(x=>x.it);
  sel = 0; render();
  function render() {
    res.innerHTML = hits.length ? hits.map((it,i)=>{ const href = it.type==='entry' ? `#/day/${it.day}` : it.type==='task' ? (it.src ? `#/project/${it.src}` : `#/day/${it.day}`) : `#/${it.type}/${it.id}`; const snippet = snip(it, terms);
      return `<a href="${href}" class="${i===sel?'sel':''}"><span class="t">${it.type}</span><span>${esc(it.name)}</span><span class="d">${it.date||''}</span>${snippet?`<span class="s">${snippet}</span>`:''}</a>`; }).join('') : '<a><span class="t"></span><span class="muted">No results</span></a>';
    res.classList.add('open');
  }
}
function snip(it, terms) { const t = it.text||''; const lt=t.toLowerCase(); let pos=-1; for (const term of terms) { pos = lt.indexOf(term); if (pos>=0) break; } const base = it.sub ? esc(it.sub) : ''; if (pos<0) return base; const s = Math.max(0,pos-40); return (base?base+' — ':'') + (s>0?'…':'') + esc(t.slice(s,pos+80)); }
q.addEventListener('input', () => search(q.value));
q.addEventListener('focus', () => { if (q.value) search(q.value); });
q.addEventListener('keydown', (ev) => {
  if (ev.key==='ArrowDown') { sel=Math.min(sel+1,hits.length-1); ev.preventDefault(); search(q.value); [...res.children][sel]?.scrollIntoView({block:'nearest'}); }
  else if (ev.key==='ArrowUp') { sel=Math.max(sel-1,0); ev.preventDefault(); search(q.value); }
  else if (ev.key==='Enter') { const a=[...res.children][sel]; if (a&&a.getAttribute('href')) { location.hash=a.getAttribute('href'); q.blur(); res.classList.remove('open'); } }
  else if (ev.key==='Escape') { q.blur(); res.classList.remove('open'); }
});
document.addEventListener('click', (ev) => { if (!ev.target.closest('.search')) res.classList.remove('open'); });
res.addEventListener('click', () => { res.classList.remove('open'); q.blur(); });
document.addEventListener('keydown', (ev) => {
  const typing = /input|textarea|select/i.test(document.activeElement.tagName); const native = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.ycos;
  if ((ev.metaKey||ev.ctrlKey) && ev.key.toLowerCase()==='r') { ev.preventDefault(); if (native) native.postMessage({ rebuild: true }); else location.reload(); return; }
  if ((ev.metaKey||ev.ctrlKey) && (ev.key==='[' || ev.key==='ArrowLeft')) { ev.preventDefault(); history.back(); return; }
  if ((ev.metaKey||ev.ctrlKey) && (ev.key===']' || ev.key==='ArrowRight')) { ev.preventDefault(); history.forward(); return; }
  if ((ev.metaKey||ev.ctrlKey) && ev.key.toLowerCase()==='k') { ev.preventDefault(); q.focus(); q.select(); return; }
  if (ev.key==='Escape' && P._fopen) { P._fopen = null; route(); return; }
  if (typing) return;
  if (NATIVE && (ev.key==='n' || ev.key==='N') && !ev.metaKey && !ev.ctrlKey && !ev.altKey) { ev.preventDefault(); const pg = location.hash.match(/^#\/(project|person)\/(.+)$/); const x = pg && by[pg[1]].get(decodeURIComponent(pg[2])); taskEditor(null, !x ? {} : pg[1] === 'project' ? { project: x.name } : { people: [x.name] }); return; }
  if (ev.key==='/') { ev.preventDefault(); q.focus(); q.select(); return; }
  if (location.hash.startsWith('#/day/')) { if (ev.key==='ArrowLeft' && P._dayPrev) location.hash = '#/day/' + P._dayPrev; if (ev.key==='ArrowRight' && P._dayNext) location.hash = '#/day/' + P._dayNext; }
});

// inside Nostrion-os.app (WKWebView): external links, files and obsidian:// go to the Mac side
document.addEventListener('click', (ev) => {
  const a = ev.target.closest('a'); const native = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.ycos;
  if (!a || !native) return; const href = a.getAttribute('href') || '';
  if (href.startsWith('obsidian://') || href.startsWith('http') || href.startsWith('mailto:') || a.target === '_blank') { ev.preventDefault(); native.postMessage({ open: a.href }); }
});
window.addEventListener('focus', () => { const native = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.ycos; if (native && Date.now() - (window.__lastFocusBuild||0) > 15000) { window.__lastFocusBuild = Date.now(); native.postMessage({ rebuild: true }); } });
route();
// after a task change the app reloads the page: come back to the same scroll position
try { const sp = JSON.parse(sessionStorage.getItem('ycos.scroll') || 'null'); sessionStorage.removeItem('ycos.scroll'); if (sp && sp.hash === location.hash) window.scrollTo(0, sp.y); } catch (e) {}
})();
</script>
