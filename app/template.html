<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nostrion-os</title>
<style>
  /* The hub. Design language of the Nostrion product dev hub (htmlreport tokens): General Sans on paper grey,
     black ink, hairlines, sentence case. Colour is a fill for meaning: violet live/active, iris in progress, lemon planned,
     amber needs attention, an outline for not started or archived. Neutral everywhere else. Fonts live in app/fonts. */
  @font-face{font-family:"General Sans";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/GeneralSans-400.woff2") format("woff2")}
  @font-face{font-family:"General Sans";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/GeneralSans-500.woff2") format("woff2")}
  @font-face{font-family:"General Sans";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/GeneralSans-600.woff2") format("woff2")}
  @font-face{font-family:"Gabarito";font-weight:600;font-style:normal;font-display:block;src:url("fonts/Gabarito-600.woff2") format("woff2")}
  :root{
    --paper:#F5F5F5; --white:#FFFFFF; --black:#000000; --grey:#666666; --faint:#9A9A9A; --block:#EBEBEB;
    --red:#C4352B; --violet:#4B3F80; --iris:#A99CEB; --lilac:#DDD0F4; --lemon:#EEE27C; --amber:#F2C14E;
    --surface:var(--white); --well:var(--block);
    --ink:var(--black); --ink-soft:var(--grey); --ink-dim:var(--faint);
    --line:#D6D6D6; --line-hi:#C4C4C4; --accent:var(--violet);
    --sans:"General Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
    --wordmark:"Gabarito","General Sans",Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
    --t-fast:150ms ease;
    /* category swatches: the same five fills, then outlines */
    --c-meeting:var(--violet);--c-build:var(--iris);--c-research:var(--lilac);--c-writing:var(--lemon);--c-admin:var(--block);--c-learning:var(--amber);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none !important}
  html{color-scheme:light}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums lining-nums}
  strong,b{font-weight:500}
  a{color:inherit;text-decoration:none}
  button,input,select,textarea{font:inherit;color:inherit}
  ::selection{background:var(--black);color:var(--paper)}
  :focus-visible{outline:1.5px solid var(--black);outline-offset:2px}

  /* ── shell: sidebar + main ── */
  .app{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh}
  .side{position:sticky;top:0;height:100vh;padding:28px 22px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column}
  .logo{display:inline-flex;align-items:center;gap:10px;line-height:1;align-self:flex-start}
  .logo .mark{width:14px;height:18px;flex:none}
  .logo .word{font-family:var(--wordmark);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase}
  .side .sub{font-size:13px;color:var(--ink-soft);margin:10px 0 22px}
  .nav{display:flex;flex-direction:column;gap:2px;overflow:auto;scrollbar-width:none}
  .nav .nsec{font-size:12px;color:var(--ink-dim);margin:18px 0 2px}
  .nav .nsec:first-child{margin-top:0}
  .nav a{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);padding:6px 0;font-size:14px;color:var(--ink-soft);border-bottom:1px solid transparent;transition:color var(--t-fast)}
  .nav a:hover{color:var(--ink)}
  .nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
  .nav a small{font-size:13px;color:var(--ink-dim)}
  /* footer: who you are + settings, then the build state */
  .side .foot{margin-top:auto;padding-top:var(--s4)}
  .me{display:flex;align-items:center;gap:10px;width:100%;padding:8px 0;border:0;border-top:1px solid var(--line);background:transparent;cursor:pointer;text-align:left}
  .me .av{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--white);display:inline-flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.04em;flex:none}
  .me .who{display:flex;flex-direction:column;min-width:0;line-height:1.3}
  .me .who b{font-weight:400;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .me .who small{font-size:12px;color:var(--ink-dim)}
  .me .gearw{margin-left:auto;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;color:var(--ink-soft);transition:color var(--t-fast),border-color var(--t-fast)}
  .me .gear{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  .me:hover .gearw,.me[aria-current="page"] .gearw{color:var(--ink);border-color:var(--line-hi)}
  .me:hover .who small{color:var(--ink-soft)}
  .side .state{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-dim);margin-top:4px}
  .side .state i{width:6px;height:6px;border-radius:50%;background:var(--violet);flex:none}
  .side .state.web i{background:var(--line-hi)}
  .side .state a{margin-left:auto;color:var(--ink-soft);border-bottom:1px solid var(--line-hi)} .side .state a:hover{color:var(--ink);border-bottom-color:var(--ink)}
  /* sidebar toggle */
  .navtog{position:absolute;top:10px;right:8px;width:22px;height:22px;border:1px solid transparent;background:none;color:var(--ink-dim);font-size:16px;line-height:1;cursor:pointer;padding:0}
  .navtog:hover{color:var(--ink);border-color:var(--line-hi)}
  .app.nav-off{grid-template-columns:minmax(0,1fr)}
  .app.nav-off .side{display:none}
  .navshow{position:fixed;left:0;top:14px;z-index:30;width:22px;height:28px;border:1px solid var(--line-hi);border-left:0;background:var(--surface);color:var(--ink-soft);cursor:pointer;font-size:14px;line-height:1;padding:0;display:none}
  .app.nav-off ~ .navshow{display:block}
  .navshow:hover{color:var(--ink)}
  .menubtn{display:none}

  main{padding:28px 40px 80px;min-width:0;max-width:1480px;width:100%}
  /* page header: crumbs, title, one sub line; actions and search on the right */
  header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--s4);padding-bottom:14px;margin-bottom:28px;border-bottom:1px solid var(--line)}
  header.top .ttl{min-width:0}
  .crumbs{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;font-size:13px;color:var(--ink-dim);margin-bottom:6px}
  .crumbs a{color:var(--ink-soft);cursor:pointer;border-bottom:1px solid transparent}
  .crumbs a:hover{color:var(--ink);border-bottom-color:var(--ink)}
  .crumbs .sep{color:var(--line-hi)}
  h1{font-size:40px;font-weight:400;letter-spacing:-.02em;line-height:1.1;overflow-wrap:anywhere}
  #sub{color:var(--ink-soft);margin-top:4px}
  #sub:empty{display:none}
  header.top .right{display:flex;align-items:flex-end;gap:var(--s3);flex:none;margin-bottom:6px}
  header.top .acts{display:flex;gap:6px;align-items:center}
  .hist{display:flex;gap:2px}
  .hist button{width:26px;height:26px;border:1px solid transparent;background:none;color:var(--ink-dim);cursor:pointer;font-size:14px;line-height:1;padding:0}
  .hist button:hover{color:var(--ink);border-color:var(--line-hi)}
  .gsearch{position:relative;width:280px;max-width:100%}
  .gsearch .tin{padding-right:4px}
  .gs-menu{position:absolute;top:calc(100% + 6px);right:0;z-index:50;width:520px;max-width:calc(100vw - 32px);max-height:440px;overflow:auto;background:var(--surface);border:1px solid var(--line-hi);padding:4px;scrollbar-width:thin;box-shadow:0 10px 28px rgba(12,16,30,.08);display:none}
  .gs-menu.open{display:block}
  .gs-menu a{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;padding:6px 8px;font-size:13px}
  .gs-menu a.sel,.gs-menu a:hover{background:var(--paper)}
  .gs-menu .t{font-size:12px;color:var(--ink-dim)}
  .gs-menu .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gs-menu .d{font-size:12px;color:var(--ink-dim)}
  .gs-menu .s{grid-column:2/4;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gs-menu .none{padding:10px 8px;color:var(--ink-dim)}

  /* ── components (as in the dev hub) ── */
  .btn{font-family:var(--sans);font-size:13px;background:transparent;color:var(--ink);border:1px solid var(--line);padding:5px 12px;cursor:pointer;text-align:center;transition:background var(--t-fast),color var(--t-fast),border-color var(--t-fast);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;line-height:1.5}
  .btn:hover{background:var(--ink);color:var(--surface);border-color:var(--ink)}
  .btn.primary,.btn.active{background:var(--ink);color:var(--surface);border-color:var(--ink)}
  .btn.primary:hover{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.danger{color:var(--red);border-color:var(--red)}
  .btn.danger:hover,.btn.danger.armed{background:var(--red);border-color:var(--red);color:var(--white)}
  .btn[disabled]{opacity:.35;pointer-events:none}
  .btn.sm{padding:2px 9px;font-size:12px}
  .btn-x{background:none;border:0;color:var(--ink-dim);font-size:14px;line-height:1;cursor:pointer;padding:4px}
  .btn-x:hover{color:var(--ink)}
  .seg{display:inline-flex;background:var(--well);border-radius:999px;padding:2px;gap:2px;flex-wrap:wrap}
  .seg button{font-size:13px;border:0;border-radius:999px;padding:4px 11px;white-space:nowrap;color:var(--ink-soft);background:transparent;cursor:pointer;transition:background var(--t-fast),color var(--t-fast)}
  .seg button:hover{color:var(--ink)}
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
  .seg button small{font-size:12px;opacity:.6;margin-left:5px}
  .seg button.zero{opacity:.5}
  .tin{font-family:var(--sans);font-size:14px;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);padding:var(--s1) 0;width:100%;line-height:1.5;border-radius:0;-webkit-appearance:none;appearance:none}
  .tin:focus{outline:none;border-bottom-color:var(--ink)}
  .tin::placeholder{color:var(--ink-dim)}
  textarea.tin{resize:vertical;min-height:60px;display:block}
  select.tin{cursor:pointer;padding-right:16px;background:linear-gradient(45deg,transparent 50%,currentColor 50%) right 4px top 55%/5px 5px no-repeat,linear-gradient(-45deg,transparent 50%,currentColor 50%) right 0 top 55%/5px 5px no-repeat}
  input[type=date].tin{width:auto;font-size:13px}
  .pill{display:inline-block;border-radius:999px;font-size:12px;padding:2px 9px;white-space:nowrap;line-height:1.45;border:1px solid transparent;vertical-align:middle}
  .pill--violet{background:var(--violet);color:var(--white)}
  .pill--iris{background:var(--iris);color:var(--black)}
  .pill--lemon{background:var(--lemon);color:var(--black)}
  .pill--amber{background:var(--amber);color:var(--black)}
  .pill--ink{background:var(--ink);color:var(--surface)}
  .pill--well{background:var(--well);color:var(--ink)}
  .pill--line{color:var(--ink-soft);border:1px solid var(--line-hi)}
  /* category: a small square swatch + the name */
  .cat{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-soft);white-space:nowrap}
  .dot{display:inline-block;width:9px;height:9px;background:var(--dot,var(--block));border:1px solid var(--dotb,transparent);flex:none}
  /* dropdown filters: one per group, ink when narrowed */
  .controls{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s3);margin:0 0 var(--s4)}
  .spacer{flex:1}
  .ctl-l{font-size:13px;color:var(--ink-dim)}
  .fgrp{position:relative}
  .fbtn{font-size:13px;padding:4px 11px;border:1px solid var(--line);background:transparent;color:var(--ink-soft);border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;user-select:none;transition:color var(--t-fast),border-color var(--t-fast)}
  .fbtn:hover{color:var(--ink);border-color:var(--ink-dim)}
  .fbtn::after{content:"";width:5px;height:5px;border-right:1px solid currentColor;border-bottom:1px solid currentColor;transform:rotate(45deg);margin-top:-3px}
  .fbtn b{font-weight:400}
  .fbtn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
  .fbtn.def{border-style:dashed}
  .fgrp.open .fbtn:not(.on){border-color:var(--ink);color:var(--ink)}
  .menu,.fpop{position:absolute;top:calc(100% + 6px);left:0;z-index:40;min-width:220px;max-height:340px;overflow:auto;background:var(--white);border:1px solid var(--line);padding:4px;scrollbar-width:thin}
  .menu.right{left:auto;right:0}
  .menu button,.menu a,.fopt{display:flex;align-items:center;gap:9px;width:100%;font-size:13px;color:var(--ink);background:transparent;border:0;padding:6px 8px;cursor:pointer;text-align:left;user-select:none}
  .menu button:hover,.menu a:hover,.fopt:hover{background:var(--paper)}
  .menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
  .menu .danger{color:var(--red)}
  .fopt .ck{width:12px;height:12px;border:1px solid var(--grey);display:inline-block;flex:none}
  .fopt.on .ck{background:var(--ink);border-color:var(--ink)}
  .fopt.part .ck{background:linear-gradient(var(--ink),var(--ink)) center/6px 1px no-repeat}
  .fopt small{margin-left:auto;color:var(--ink-dim);padding-left:12px}
  .fopt.zero{opacity:.45}
  .fopt.all{color:var(--ink-soft);border-bottom:1px solid var(--line);margin-bottom:4px}
  .fopt .only{display:none;margin-left:auto;padding:0 8px;font-size:12px;color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;line-height:18px}
  .fopt .only:hover{color:var(--ink);border-color:var(--ink)}
  .fopt:hover .only{display:inline-block} .fopt:hover .only + small{margin-left:0;padding-left:8px}
  .fhint{padding:6px 8px 2px;font-size:12px;color:var(--ink-dim)}
  .freset{font-size:13px;color:var(--ink-soft);cursor:pointer;border-bottom:1px solid var(--line-hi)} .freset:hover{color:var(--ink);border-bottom-color:var(--ink)}
  .dd{position:relative;display:inline-block}

  /* tables: on paper, black rule under the header, hairlines between rows */
  .tscroll{overflow-x:auto;scrollbar-width:thin;margin:0 0 var(--s5)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.45}
  thead th{font-size:13px;font-weight:400;color:var(--ink-soft);white-space:nowrap;position:sticky;top:0;background:var(--paper);z-index:2;border-bottom:0;box-shadow:inset 0 -1px 0 var(--black)} /* a shadow, not a border: WebKit leaves gaps in the borders of sticky cells */
  .panel thead th,aside.facts thead th{background:var(--white)}
  th:first-child,td:first-child{padding-left:0} th:last-child,td:last-child{padding-right:0}
  td.num,th.num{text-align:right;white-space:nowrap}
  td.nowrap{white-space:nowrap}
  td.dim,td.muted{color:var(--ink-soft)}
  td.name{color:var(--ink);min-width:180px}
  td.name small{display:block;color:var(--ink-dim);font-size:13px}
  td.name small.clip2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:64ch;color:var(--ink-soft)}
  th.sortable{cursor:pointer;user-select:none}
  th.sortable:hover,th.sortable.sorted{color:var(--ink)}
  th .arr{font-size:11px;margin-left:3px}
  tr.row{cursor:pointer}
  tr.row:hover td{background:var(--white)}
  tr.row.dim td{color:var(--ink-soft)}
  tr.grp td{padding:26px 10px 8px 0;font-size:18px;font-weight:400;color:var(--ink);border-bottom:1px solid var(--line);background:var(--paper)}
  tr.grp td small{font-size:13px;color:var(--ink-soft);margin-left:var(--s3)}
  tr.grp:first-child td{padding-top:var(--s2)}
  tr.total td{color:var(--ink);border-bottom:0;border-top:1px solid var(--black)}
  td.indent{padding-left:22px}
  td.indent::before{content:"└";color:var(--ink-dim);margin:0 8px 0 -16px}
  .zero,.none-v{color:var(--ink-dim)}
  table.grid.fx{table-layout:auto}
  tr.done td.name{color:var(--ink-soft);text-decoration:line-through}

  /* stats: tiles on a hairline grid */
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:0 0 var(--s6)}
  .stats.two-up{grid-template-columns:repeat(2,minmax(0,1fr));max-width:560px}
  .stat{display:flex;flex-direction:column;justify-content:space-between;gap:24px;min-height:120px;padding:14px 16px;background:var(--paper);color:inherit}
  a.stat:hover{background:var(--white)}
  .stat-label{font-size:13px;color:var(--ink-soft)}
  .stat-value{font-size:44px;font-weight:400;line-height:1;letter-spacing:-.03em}
  .stat-value small{font-size:14px;color:var(--ink-soft);letter-spacing:0;margin-left:8px}
  .bar-track{height:6px;background:var(--block);border-radius:3px;position:relative;overflow:hidden;width:120px;display:inline-block;vertical-align:middle;margin-right:8px}
  .bar-fill{position:absolute;inset:0 auto 0 0;background:var(--violet);border-radius:3px}

  /* sections: a heading row that folds; the count and tools sit on it */
  .sec{margin:0 0 40px}
  .sec > summary{list-style:none;display:flex;align-items:baseline;gap:var(--s3);padding-bottom:10px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
  .sec > summary::-webkit-details-marker{display:none}
  .sec > summary b{font-weight:400;font-size:22px;letter-spacing:-.01em;line-height:1.2}
  .sec > summary .n{font-size:13px;color:var(--ink-soft)}
  .sec > summary .tools{margin-left:auto;display:flex;gap:6px;align-items:center}
  .sec > summary::after{content:"";width:6px;height:6px;border-right:1px solid var(--ink-dim);border-bottom:1px solid var(--ink-dim);transform:rotate(45deg);margin:0 2px 0 var(--s2);align-self:center;transition:transform var(--t-fast)}
  .sec:not([open]) > summary::after{transform:rotate(-45deg)}
  .sec > summary:hover b{color:var(--accent)}
  .sec .more-row{padding:10px 0;font-size:13px}
  .lede{font-size:14px;color:var(--ink-soft);max-width:92ch;margin:0 0 var(--s4)}
  .empty{color:var(--ink-dim);padding:var(--s4) 0;font-size:14px}
  .hint{font-size:13px;color:var(--ink-dim);margin-top:var(--s3)}
  code{font:12.5px var(--mono);background:var(--well);padding:1px 5px}
  :not(pre) > code{overflow-wrap:anywhere}

  /* detail pages: content on the left, the facts panel on the right (sticky), Settings folded at its end */
  .detail{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:var(--s6);align-items:start}
  .detail > .col{min-width:0}
  aside.facts{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:var(--s4) var(--s4) var(--s3);position:sticky;top:var(--s4);max-height:calc(100vh - 32px);overflow:auto;scrollbar-width:thin}
  .kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;font-size:14px}
  .kv dt{color:var(--ink-dim);white-space:nowrap}
  .kv dt::first-letter{text-transform:uppercase}
  .kv dd{color:var(--ink);min-width:0;overflow-wrap:anywhere}
  .kv dd .wl{border-bottom:1px solid var(--line-hi)}
  .kv dd .wl:hover{border-bottom-color:var(--ink)}
  aside.facts .grp-l{font-size:12px;color:var(--ink-dim);margin:var(--s4) 0 var(--s2);padding-top:var(--s3);border-top:1px solid var(--line)}
  aside.facts details.settings{margin-top:var(--s4);border-top:1px solid var(--line);padding-top:var(--s2)}
  details.settings > summary{list-style:none;cursor:pointer;font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;padding:4px 0}
  details.settings > summary::-webkit-details-marker{display:none}
  details.settings > summary::before{content:"+";width:14px;height:14px;border:1px solid var(--ink-dim);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;line-height:1}
  details.settings[open] > summary::before{content:"−"}
  details.settings > summary:hover{color:var(--ink)}
  details.settings .fld{margin:var(--s3) 0 0}
  .fld > label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px}
  .fld .help{font-size:12px;color:var(--ink-dim);margin-top:4px}
  .daynav{display:flex;justify-content:space-between;gap:var(--s3);font-size:13px;color:var(--ink-soft);margin:0 0 var(--s5)}
  .daynav a{border-bottom:1px solid var(--line-hi)} .daynav a:hover{color:var(--ink);border-bottom-color:var(--ink)}

  /* links inside content */
  .wl{border-bottom:1px solid transparent;transition:border-color var(--t-fast)}
  .body .wl,.notes .wl{border-bottom-color:var(--line-hi)}
  .wl:hover{border-bottom-color:var(--ink)}
  .wl.missing{border-bottom:1px dotted var(--ink-dim);color:var(--ink-soft)}
  .ext::after{content:" ↗";color:var(--ink-dim);font-size:12px}
  .sep{color:var(--line-hi);margin:0 6px}
  .tag{color:var(--ink-soft);font-size:13px}

  /* note body: nested lists step in per level, bullet shapes change per level like Obsidian */
  .body{font-size:15px;line-height:1.6;max-width:78ch}
  .body p{margin:0 0 12px}
  .body h2{font-size:20px;font-weight:400;margin:28px 0 10px} .body h3{font-size:16px;font-weight:500;margin:22px 0 6px} .body h4,.body h5{font-size:14px;font-weight:500;margin:16px 0 6px}
  .body ul,.body ol{padding-left:22px;margin:0 0 12px} .body li{margin:3px 0} .body li > ul,.body li > ol{margin:3px 0 0}
  .body ul{list-style:disc} .body ul ul{list-style:circle} .body ul ul ul{list-style:square} .body li::marker{color:var(--ink-dim)}
  .body li.task{list-style:none;margin-left:-20px} .body li.task > .trow{display:flex;gap:8px;align-items:baseline} .body li.task > ul,.body li.task > ol{margin-left:20px}
  .body li.done > .trow,.body li.cancelled > .trow{color:var(--ink-soft);text-decoration:line-through}
  .body blockquote{margin:0 0 12px;padding:2px 16px;border-left:2px solid var(--violet);color:var(--ink-soft)}
  .body pre{background:var(--white);border:1px solid var(--line);padding:14px;overflow:auto;font-size:13px;margin:0 0 12px} .body pre code{background:none;padding:0}
  .body table{margin:0 0 16px} .body img{max-width:100%}
  .body hr{border:0;border-top:1px solid var(--line);margin:20px 0}
  .tmeta{color:var(--ink-dim);font-size:12px;margin-left:6px;white-space:nowrap}

  /* log entries */
  .entry{display:grid;grid-template-columns:96px minmax(0,1fr);gap:var(--s4);padding:var(--s4) 0;border-bottom:1px solid var(--line)}
  .entry.nocol{grid-template-columns:minmax(0,1fr)}
  .entry:last-child{border-bottom:0}
  .entry .tm{color:var(--ink-soft);font-size:13px;padding-top:3px}
  .entry .tm a{border-bottom:1px solid var(--line-hi)} .entry .tm a:hover{color:var(--ink);border-bottom-color:var(--ink)}
  .entry .ttl{display:flex;justify-content:space-between;gap:var(--s4);font-size:17px;line-height:1.35;margin-bottom:4px}
  .entry .ttl .h{color:var(--ink-soft);font-size:14px;white-space:nowrap}
  .entry .meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:13px;color:var(--ink-soft);margin-bottom:8px}
  .entry .meta .wl{color:var(--ink-soft)} .entry .meta .wl:hover{color:var(--ink)}
  .entry .notes{font-size:15px;line-height:1.6;max-width:78ch} .entry .notes p:last-child,.entry .notes ul:last-child{margin-bottom:0}

  /* tasks */
  .box{flex:none;display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border:1px solid var(--grey);font-size:9px;line-height:1;color:var(--white);position:relative;top:1px;background:var(--white)}
  .box.done{background:var(--ink);border-color:var(--ink)} .box.doing{background:linear-gradient(135deg,var(--iris) 50%,var(--white) 50%);border-color:var(--iris)} .box.cancelled{background:var(--well);border-color:var(--line-hi);color:var(--ink-soft)}
  .editable .box[data-tbox]{cursor:pointer} .editable .box[data-tbox]:hover{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
  .task-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .task-row:last-child{border-bottom:0}
  .task-row .tt{min-width:0}
  .task-row:hover .tt > span:first-child{text-decoration:underline;text-decoration-color:var(--line-hi)}
  .task-row .tm2{display:block;color:var(--ink-dim);font-size:13px;margin-top:2px}
  .task-row.done .tt{color:var(--ink-soft);text-decoration:line-through}
  .overdue{color:var(--red)}
  .matrix{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4);margin-bottom:var(--s6)}
  .quad{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:var(--s3) var(--s4) var(--s2);min-height:120px}
  .quad .qh{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);padding-bottom:8px;border-bottom:1px solid var(--black)}
  .quad .qh b{font-weight:400;font-size:18px}
  .quad .qh span{font-size:13px;color:var(--ink-soft)}
  .quad .empty{padding:var(--s3) 0}

  /* cards (ideas, assets) */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--s4);margin-bottom:var(--s6)}
  .card{border:1px solid var(--line-hi);background:var(--surface);padding:var(--s3);cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color var(--t-fast)}
  .card:hover{border-color:var(--ink-dim)}
  .card .nm{font-size:14px}
  .card .what{font-size:13px;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .card .foot{font-size:12px;color:var(--ink-dim);margin-top:auto}
  .card.media{padding:0}
  .card.media .th{height:160px;background:var(--well);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--ink-soft);font:13px var(--mono)}
  .card.media .th{padding:14px}
  .card.media .th img{width:100%;height:100%;object-fit:contain;display:block} /* the whole file, never a cropped fragment */
  .card.media .cap{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
  .card.media .cap b{font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card.media .cap span{color:var(--ink-dim);font-size:12px}

  /* small bits */
  .own{display:inline-flex;align-items:center;gap:5px;white-space:nowrap} .own svg{width:15px;height:15px} .own b{display:inline-block;min-width:17px;padding:0 5px;font-size:11px;line-height:17px;text-align:center;font-weight:400;background:var(--well);border-radius:999px}
  .mini{display:inline-block;margin-left:6px;padding:0 9px;font-size:12px;line-height:20px;color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;cursor:pointer;white-space:nowrap;transition:background var(--t-fast),color var(--t-fast),border-color var(--t-fast)} .mini:first-child{margin-left:0}
  .mini:hover{background:var(--ink);color:var(--white);border-color:var(--ink)}
  .clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .kbd{font:11px var(--mono);border:1px solid var(--line);padding:0 5px;color:var(--ink-soft)}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--surface);font-size:13px;padding:7px 12px;opacity:0;transition:opacity var(--t-fast);pointer-events:none;z-index:120;max-width:80vw}
  #toast.on{opacity:1} #toast.err{background:var(--amber);color:var(--black)}

  /* task editor: a modal sheet */
  .tmodal{position:fixed;inset:0;background:rgba(12,16,30,.35);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:12vh var(--s4) var(--s4)}
  .tform{background:var(--surface);width:560px;max-width:100%;padding:var(--s5);border:1px solid var(--line-hi)}
  .tform .hd{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3);margin-bottom:var(--s3)}
  .tform .hd h2{font-size:18px;font-weight:400}
  .tform .hd a{font-size:13px;color:var(--ink-soft);border-bottom:1px solid var(--line-hi)}
  .tgrid{display:grid;grid-template-columns:90px minmax(0,1fr);gap:var(--s3) var(--s3);align-items:center;margin:var(--s4) 0 0;font-size:13px}
  .tgrid > label{color:var(--ink-soft)}
  .tppl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .pchip{display:inline-flex;gap:6px;align-items:center;padding:2px 4px 2px 10px;background:var(--well);font-size:13px;border-radius:999px}
  .tfoot{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s5);padding-top:var(--s3);border-top:1px solid var(--line);font-size:13px;color:var(--ink-dim)}
  .tfoot .sp{margin-left:auto}

  /* in-app editor */
  .editor textarea{display:block;width:100%;min-height:calc(100vh - 250px);padding:var(--s5) var(--s6) 40vh;border:1px solid var(--line);border-radius:6px;background:var(--white);font-family:var(--sans);font-size:15px;line-height:1.7;color:var(--ink);resize:none;outline:none;tab-size:4;-moz-tab-size:4;white-space:pre-wrap;overflow-wrap:break-word}
  .editor textarea:focus{border-color:var(--line-hi)}
  .editor .conflict{display:flex;align-items:center;gap:var(--s2);background:var(--lemon);padding:8px 12px;font-size:13px;margin-bottom:var(--s3)}
  .editor .conflict span{margin-right:auto}
  .estate{font-size:13px;color:var(--ink-dim);margin-right:6px} .estate.dirty{color:var(--ink)} .estate.err{color:var(--red)}

  /* settings page */
  .sgroups{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s5);max-width:880px}
  .sgroup{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:var(--s4) var(--s5) var(--s5)}
  .sgroup h2{font-size:18px;font-weight:400;margin:0 0 2px}
  .sgroup .lede{font-size:13px;margin:0 0 var(--s3)}
  .sgroup .row2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
  .sgroup .path{display:flex;align-items:center;gap:var(--s2);font:13px var(--mono);padding:6px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
  .sgroup .path span{flex:1;min-width:0}
  .sgroup .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:var(--s3)}

  @media (max-width:1180px){.detail{grid-template-columns:minmax(0,1fr)}aside.facts{position:static;max-height:none;order:-1}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:900px){.matrix{grid-template-columns:1fr}.sgroup .row2{grid-template-columns:1fr}}
  @media (max-width:760px){
    .app{grid-template-columns:1fr}
    .side{position:sticky;top:0;z-index:60;height:auto;padding:12px 16px;border-right:0;border-bottom:1px solid var(--line);background:var(--paper);flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 12px}
    .side .sub{display:none}
    .navtog{display:none}
    .menubtn{display:inline-flex;margin-left:auto;border:1px solid var(--line);background:none;padding:4px 10px;font-size:13px;cursor:pointer}
    .side .nav,.side .foot{display:none;width:100%}
    .side.open .nav,.side.open .foot{display:flex}
    .side.open .foot{flex-direction:column}
    main{padding:var(--s4) var(--s4) var(--s6)}
    header.top{flex-direction:column;align-items:stretch}
    header.top .right{flex-wrap:wrap;margin-bottom:0}
    .gsearch{width:auto;flex:1 1 100%;order:-1}
    header.top .hist{display:none}
    h1{font-size:30px}
    .entry{grid-template-columns:1fr}.entry .tm{padding-top:0}
    .stats{grid-template-columns:1fr 1fr}.stat{min-height:96px}.stat-value{font-size:34px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
  @media print{.side,header.top .right,aside.facts details.settings{display:none}.app{grid-template-columns:1fr}}
</style>

<body>
<script>/*__DATA__*/</script>
<div class="app" id="app">
  <aside class="side" id="side">
    <button class="navtog" id="nav-hide" type="button" title="Hide the sidebar">‹</button>
    <a class="logo" href="#/today" aria-label="Nostrion"><svg class="mark" viewBox="0 0 22 29" aria-hidden="true"><path d="M4.576 3.436v20.28L0 20.63V1.492zM21.978 7.45v13.176l-4.577 3.087V4.363z" fill="currentColor"/><path d="M13.409 1.671v24.734l-2.423 1.634-2.424-1.635V1.598L10.931 0z" fill="#40E0D0"/></svg><span class="word">Nostrion</span></a>
    <button class="menubtn" id="menubtn" type="button">Menu</button>

  </aside>
  <main>
    <header class="top">
      <div class="ttl"><div class="crumbs" id="crumbs" hidden></div><h1 id="h1"></h1><div id="sub"></div></div>
      <div class="right">
        <div class="acts" id="acts"></div>
        <div class="hist"><button type="button" onclick="history.back()" title="Back (⌘[)">←</button><button type="button" onclick="history.forward()" title="Forward (⌘])">→</button></div>
        <div class="gsearch"><input id="q" class="tin" type="search" placeholder="Search everything  ( / )" autocomplete="off" spellcheck="false"><div class="gs-menu" id="results"></div></div>
      </div>
    </header>
    <div id="content"></div>
  </main>
</div>
<button class="navshow" id="nav-show" type="button" title="Show the sidebar">›</button>
<div id="toast"></div>
<script>
(() => {
const D = window.YCOS; if (!D) { document.getElementById('content').innerHTML = '<div class="empty">No data. Run <code>node app/build.js</code>.</div>'; return; }
const S = D.settings || {};
const APP = S.appName || 'Nostrion-os';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const jsArg = (v) => JSON.stringify(v).replace(/"/g, '&quot;');
const NATIVE = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.ycos; // inside the app: notes, tasks and settings can be changed
const by = { person: new Map(D.people.map(x=>[x.id,x])), project: new Map(D.projects.map(x=>[x.id,x])), doc: new Map(D.docs.map(x=>[x.id,x])), asset: new Map(D.assets.map(x=>[x.id,x])), repo: new Map((D.repos||[]).map(x=>[x.id,x])), day: new Map(D.days.map(x=>[x.id,x])) };
const entries = new Map(); for (const d of D.days) for (const e of d.entries) entries.set(e.id, e);
const fmtDate = (s, opts) => { if (!s) return ''; const d = new Date(s + 'T00:00:00'); return d.toLocaleDateString('en-US', opts || { weekday:'short', day:'numeric', month:'short', year:'numeric' }); };
const month = (s) => new Date(s.slice(0,7)+'-01T00:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'});
const md = (s) => fmtDate(s,{month:'short',day:'numeric'});
const h = (n) => n == null ? '' : (Math.round(n*100)/100) + 'h';
const r1 = (n) => Math.round(n*10)/10;
const plural = (n, w, ws) => `${n} ${n === 1 ? w : (ws || w + 's')}`;
const obs = (file) => `obsidian://open?vault=${encodeURIComponent(D.vault)}&file=${encodeURIComponent(file.replace(/\.md$/,''))}`;
const fileHref = (rel) => rel.startsWith('/') ? 'file://' + rel.split('/').map(encodeURIComponent).join('/') : '../' + rel.split('/').map(encodeURIComponent).join('/'); // absolute: a file outside the vault
const absPath = (rel) => rel.startsWith('/') ? rel : S.vaultPath + '/' + rel;
const link = (type, id, label) => { const x = by[type] && by[type].get(id); return x ? `<a class="wl" href="#/${type}/${id}">${esc(label || x.name)}</a>` : `<span class="wl missing">${esc(label || id)}</span>`; };
const links = (type, ids) => ids.map(id => link(type, id)).join('<span class="sep">·</span>');
const dash = '<span class="none-v">–</span>';
const projName = (id) => (by.project.get(id) || {}).name || id;
const personName = (id) => (by.person.get(id) || {}).name || id;
const backlinksOf = (type, id) => (D.backlinks[`${type}/${id}`] || []);
const initials = (n) => String(n || '').trim().split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase();

// ---------- colour: one palette for meaning (dev hub): violet live, iris in progress, lemon planned, amber attention, outline idle ----------
const TONE = { active:'violet', live:'violet', current:'violet', doing:'iris', paused:'iris', draft:'lemon', idea:'lemon', open:'line', done:'ink', archived:'line', cancelled:'line', outdated:'amber' };
const pill = (text, tone) => `<span class="pill pill--${tone || 'line'}">${esc(text)}</span>`;
const statusPill = (s) => s ? pill(s, TONE[s] || 'well') : '';
const SWATCH = { violet:'var(--violet)', iris:'var(--iris)', lilac:'var(--lilac)', lemon:'var(--lemon)', amber:'var(--amber)', ink:'var(--ink)', well:'var(--block)' };
const CAT_TONE = { meeting:'violet', build:'iris', research:'lilac', writing:'lemon', admin:'well', learning:'amber', brief:'violet', report:'iris', framework:'lemon', tool:'ink', reference:'well', post:'amber', presentation:'violet', prototype:'iris', note:'' };
const catTone = (c) => { if (c in CAT_TONE) return CAT_TONE[c]; let x = 0; for (const ch of String(c)) x = (x * 31 + ch.charCodeAt(0)) >>> 0; return ['violet','iris','lilac','lemon','amber'][x % 5]; };
const swatch = (c) => { const t = catTone(c); return `<span class="dot" style="${t ? `--dot:${SWATCH[t]}` : '--dot:transparent;--dotb:var(--ink-dim)'}"></span>`; };
const catHtml = (c) => c ? `<span class="cat">${swatch(c)}${esc(c)}</span>` : '';
const PRI = { do:['Do','urgent · important','amber'], plan:['Plan','important · not urgent','violet'], delegate:['Delegate','urgent · not important','iris'], later:['Later','not urgent · not important','line'] };
const priHtml = (p) => p && PRI[p] ? pill(PRI[p][0], PRI[p][2]) : '';

// ---------- toast ----------
const toast = (msg, err) => { const el = $('#toast'); el.textContent = msg; el.className = 'on' + (err ? ' err' : ''); clearTimeout(toast._t); toast._t = setTimeout(() => el.className = '', 1800); };
const copyText = (text, note) => { if (NATIVE) NATIVE.postMessage({ copy: text }); else if (navigator.clipboard) navigator.clipboard.writeText(text).catch(()=>{}); toast(note || 'Copied'); };
window.ycCopy = (ev, text, note) => { ev.stopPropagation(); ev.preventDefault(); copyText(text, note); };
window.ycReveal = (ev, path) => { ev.stopPropagation(); ev.preventDefault(); if (NATIVE) NATIVE.postMessage({ reveal: path }); };
// every change the app makes ends in a rebuild + reload: remember where we were
const keepScroll = () => { try { sessionStorage.setItem('ycos.scroll', JSON.stringify({ hash: location.hash, y: window.scrollY })); } catch (e) {} };
function nativeSend(msg, note) { if (!NATIVE) return; keepScroll(); toast(note || 'Saving…'); NATIVE.postMessage(msg); }

// ---------- sidebar ----------
const openTasks = D.tasks.filter(t => t.status === 'open' || t.status === 'doing').length;
const NAV = [
  ['sec','Overview'], ['today','Today',''],
  ['sec','Log'], ['journal','Daily Log', D.days.length], ['tasks','Tasks', openTasks || ''], ['hours','Hours', D.totals.hours],
  ['sec','Vault'], ['projects','Projects', D.projects.length], ['people','People', D.people.length], ['library','Library', D.docs.length], ['assets','Assets', D.assets.length || ''], ['repos','Repos', (D.repos||[]).length || ''],
];
function renderNav(active) {
  $('#nav').innerHTML = NAV.map(([k,l,c]) => k==='sec' ? `<div class="nsec">${l}</div>` : `<a href="#/${k}"${active===k?' aria-current="page"':''}>${l}<small>${c===''?'':c}</small></a>`).join('');
  const name = S.name || 'Your name';
  $('#foot').innerHTML = `<a class="me" href="#/settings"${active==='settings'?' aria-current="page"':''} title="Profile and settings"><span class="av">${S.name ? esc(initials(S.name)) : '+'}</span><span class="who"><b>${esc(name)}</b><small>${esc(S.role || 'Settings')}</small></span><span class="gearw" title="Settings"><svg class="gear" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1.03z"/></svg></span></a>
    <div class="state ${NATIVE?'':'web'}" title="${NATIVE?'The hub reads every note in the vault and redraws itself whenever a file changes, so this is the time of the last change it picked up.':'Opened in a browser: read only'}"><i></i>${NATIVE?`Up to date · ${new Date(D.generated).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}<a href="#" id="rebuild" title="Read the vault again now (⌘R). Only needed when a change does not show up by itself.">Refresh</a>`:'Read only in a browser'}</div>`;
  if (NATIVE) $('#rebuild').addEventListener('click', ev => { ev.preventDefault(); keepScroll(); NATIVE.postMessage({ rebuild: true }); });
  $('#side').classList.remove('open');
}
const navOff = () => { try { return localStorage.getItem('ycos.navOff') === '1'; } catch (e) { return false; } };
const setNav = (off) => { $('#app').classList.toggle('nav-off', off); try { localStorage.setItem('ycos.navOff', off ? '1' : '0'); } catch (e) {} };
setNav(navOff());

// a long list shows its first rows; the rest unfold in place

// ---------- note actions: Edit (here or in Obsidian, Settings → Obsidian) + a menu with the rest ----------

const LIST_OF = { project: '#/projects', doc: '#/library', person: '#/people' };
const editHref = (file) => `#/edit/${encodeURIComponent(file)}`;
function noteActs(file, extra = []) { // extra: [{label, href | on, primary?}] — a primary extra replaces Edit as the main button
  const isMd = file && /\.md$/.test(file); const items = [];
  let primary = extra.find(x => x.primary);

  if (isMd && NATIVE && S.editIn === 'obsidian') items.push({ label: 'Edit here', href: editHref(file) });

  const a = (x, cls) => x.href ? `<a class="${cls}" href="${esc(x.href)}"${/^(https?|obsidian|file):/.test(x.href) ? ' data-ext="1"' : ''}${x.edit ? ' data-edit' : ''}>${esc(x.label)}</a>` : `<button type="button" class="${cls}" onclick="${x.on}">${esc(x.label)}</button>`;
  return `${primary ? a(primary, 'btn primary') : ''}${items.length ? `<div class="dd"><button class="btn" type="button" data-dd title="More">•••</button><div class="menu right" hidden>${items.map(x => a(x, '')).join('')}</div></div>` : ''}`;

document.addEventListener('click', ev => { // dropdown menus: one open at a time, a click elsewhere closes

function settingsFold(kind, x) { // status + delete, folded at the end of the facts panel (inside the app only)
  if (!NATIVE || !x.file || !x.file.endsWith('.md') || !STATUS_OPTS[kind]) return '';
  const cur = x.status || ''; const opts = STATUS_OPTS[kind].slice(); if (cur && !opts.includes(cur)) opts.unshift(cur);
  return `<details class="settings"><summary>Settings</summary>
    <div class="fld"><label>Status</label><span class="seg">${opts.map(o => `<button type="button" data-status="${esc(o)}" data-file="${esc(x.file)}" aria-pressed="${o===cur}">${esc(o)}</button>`).join('')}</span><div class="help">Writes <code>status:</code> in the note.</div></div>
    <div class="fld"><label>Delete</label><button class="btn danger sm" type="button" data-trash="${esc(x.file)}" data-back="${LIST_OF[kind]}">Move to trash</button><div class="help">Moves the note to <code>.trash/</code> in the vault. Recoverable.</div></div></details>`;

document.addEventListener('click', ev => {
  const s = ev.target.closest('[data-status]'); if (s) { if (s.getAttribute('aria-pressed') === 'true') return; nativeSend({ status: { file: s.dataset.file, status: s.dataset.status } }, 'Status → ' + s.dataset.status); return; }
  const t = ev.target.closest('[data-trash]'); if (!t) return; // delete asks for a second click (WKWebView shows no confirm() dialogs)
  if (!t.classList.contains('armed')) { t.classList.add('armed'); t.textContent = 'Click again to delete'; clearTimeout(t._t); t._t = setTimeout(() => { t.classList.remove('armed'); t.textContent = 'Move to trash'; }, 5000); return; }
  location.hash = t.dataset.back; nativeSend({ trash: { file: t.dataset.trash } }, 'Moved to trash');

// ---------- shared filters + sortable tables ----------
// fstate() keeps a page's filter/sort state (persisted, so a rebuild-reload keeps it), makeFilter() renders one dropdown per group
// with live counts, tableHtml() renders one aligned table with sortable headers.
const FS = (() => { try { return JSON.parse(localStorage.getItem('ycos.filters') || '{}'); } catch (e) { return {}; } })();
const saveFS = () => { try { localStorage.setItem('ycos.filters', JSON.stringify(FS)); } catch (e) {} };
const fstate = (page, defaults) => { const st = FS[page] = Object.assign({}, defaults, FS[page] || {}); if (!st.off || typeof st.off !== 'object') st.off = {}; if (!st.sort) st.sort = defaults.sort; delete st.sel; st._page = page; st._defaults = defaults; return st; };
const asList = (v) => v == null || v === '' ? [] : Array.isArray(v) ? v : [v];
// groups: {k, label, get(item) → value | values, order?, defaultOff? (values hidden until switched on), none? (label for items without a value), labelOf?, dot? (category swatch)}
function makeFilter(st, groups, items) {
  for (const g of groups) {
    const seen = new Map(); let empties = 0;
    for (const it of items) { const vs = asList(g.get(it)); if (!vs.length) empties++; for (const v of vs) if (!seen.has(v)) seen.set(v, { v, l: g.labelOf ? g.labelOf(v) : String(v) }); }
    if (g.none && empties) seen.set('', { v: '', l: g.none });
    g._vals = [...seen.values()].sort((a, b) => { const o = g.order || []; const ia = a.v === '' ? 998 : o.indexOf(a.v), ib = b.v === '' ? 998 : o.indexOf(b.v); return (ia < 0 ? 500 : ia) - (ib < 0 ? 500 : ib) || String(a.l).localeCompare(String(b.l)); });
    g._all = g._vals.map(x => x.v);
    g._def = g._all.filter(v => !(g.defaultOff || []).includes(v));
    // a narrowed group is stored as the values it HIDES, so a value that appears later is shown by default
    const off = Array.isArray(st.off[g.k]) ? st.off[g.k] : (g.defaultOff || []);
    g._sel = g._all.filter(v => !off.includes(v));
    g._isAll = g._sel.length === g._all.length;
    g._dirty = g._sel.length !== g._def.length || g._sel.some(v => !g._def.includes(v));
    g._has = (it, v) => { const vs = asList(g.get(it)); return v === '' ? !vs.length : vs.includes(v); };
    g._pass = (it) => { if (g._isAll) return true; const vs = asList(g.get(it)); if (!vs.length) return g.none ? g._sel.includes('') : true; return vs.some(v => g._sel.includes(v)); };
  }
  const passExcept = (it, skip) => groups.every(g => g === skip || g._pass(it));
  const pass = (it) => groups.every(g => g._pass(it));
  const shown = groups.filter(g => g._vals.length > 1 || g._dirty);
  const opt = (g, x) => { const n = items.filter(it => passExcept(it, g) && g._has(it, x.v)).length; const on = g._sel.includes(x.v);
    return `<div class="fopt ${on ? 'on' : ''} ${n ? '' : 'zero'}" data-g="${esc(g.k)}" data-v="${esc(x.v)}"><span class="ck"></span>${x.v !== '' && g.dot ? swatch(x.v) : ''}<span>${esc(x.l)}</span><span class="only" data-only="1" title="Show only ${esc(x.l)}">only</span><small>${n}</small></div>`; };
  const summary = (g) => { const sel = g._vals.filter(x => g._sel.includes(x.v)), off = g._vals.filter(x => !g._sel.includes(x.v));
    if (!sel.length) return 'none';
    if (off.length && off.length <= 2 && off.length <= sel.length) return 'without ' + off.map(x => x.l).join(', ');
    return sel.length <= 2 ? sel.map(x => x.l).join(', ') : sel.length + ' of ' + g._vals.length; };
  const btn = (g) => { const open = P._fopen === g.k; const cls = g._isAll ? '' : g._dirty ? 'on' : 'def';
    return `<span class="fgrp ${open ? 'open' : ''}"><span class="fbtn ${cls}" data-g="${esc(g.k)}" data-open="1">${esc(g.label)}${g._isAll ? '' : `<b>· ${esc(summary(g))}</b>`}</span>${open ? `<div class="fpop"><div class="fopt all ${g._isAll ? 'on' : g._sel.length ? 'part' : ''}" data-g="${esc(g.k)}" data-v="*"><span class="ck"></span><span>All</span><small>${items.filter(it => passExcept(it, g)).length}</small></div>${g._vals.map(x => opt(g, x)).join('')}<div class="fhint">Click to show or hide · “only” for just one</div></div>` : ''}</span>`; };
  const dirty = groups.some(g => g._dirty) || (st._defaults.sort && (st.sort.k !== st._defaults.sort.k || st.sort.d !== st._defaults.sort.d));
  P._groups = groups;
  return { html: shown.map(btn).join('') + (dirty ? `<span class="freset" data-reset="1">Reset</span>` : ''), pass, dirty, n: items.filter(pass).length };
}
const controls = (...parts) => `<div class="controls fbar">${parts.filter(Boolean).join('')}</div>`;
const cmpVal = (a, b) => { const ea = a == null || a === '', eb = b == null || b === ''; if (ea || eb) return ea && eb ? 0 : ea ? 1 : -1; return typeof a === 'number' && typeof b === 'number' ? a - b : String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' }); };
function sortRows(rows, cols, sort, tie) { const c = cols.find(x => x.k === sort.k) || cols[0]; const dir = sort.d === 'desc' ? -1 : 1;
  return rows.slice().sort((a, b) => { const va = c.v(a), vb = c.v(b); const ea = va == null || va === '', eb = vb == null || vb === ''; if (ea !== eb) return ea ? 1 : -1; return dir * cmpVal(va, vb) || (tie ? tie(a, b) : 0); }); }
// cols: {k, l, w?, num?, cls?, v(row) → sort value, r(row) → cell html, dd? default direction}; opts: {href(row), group:{keys, of(row), label(key) → html}, rowCls(row), attr(row), empty}
function tableHtml(cols, rows, sort, opts = {}) {
  const head = cols.map(c => { const on = sort && sort.k === c.k; return `<th class="${sort ? 'sortable' : ''} ${on ? 'sorted' : ''} ${c.num ? 'num' : ''}" ${sort ? `data-k="${c.k}" data-d="${c.dd || (c.num ? 'desc' : 'asc')}"` : ''}>${esc(c.l)}${on ? `<span class="arr">${sort.d === 'asc' ? '↑' : '↓'}</span>` : ''}</th>`; }).join('');
  let body = '', cur = null; const grouping = opts.group && (!sort || opts.group.keys.includes(sort.k));
  for (const r of rows) {
    if (grouping) { const gk = opts.group.of(r); if (gk !== cur) { cur = gk; body += `<tr class="grp"><td colspan="${cols.length}">${opts.group.label(gk)}</td></tr>`; } }
    body += `<tr class="${opts.href || opts.attr ? 'row' : ''} ${opts.rowCls ? opts.rowCls(r) : ''}" ${opts.href ? `onclick="location.hash='${opts.href(r)}'"` : ''} ${opts.attr ? opts.attr(r) : ''}>${cols.map(c => { const v = c.r(r); return `<td class="${c.num ? 'num' : ''} ${typeof c.cls === 'function' ? c.cls(r) : c.cls || ''}" ${typeof c.style === 'function' ? `style="${c.style(r)}"` : ''}>${v === '' || v == null ? dash : v}</td>`; }).join('')}</tr>`;
  }
  return `<div class="tscroll"><table class="grid fx"><colgroup>${cols.map(c => c.w ? `<col style="width:${c.w}">` : '<col>').join('')}</colgroup><thead><tr>${head}</tr></thead><tbody>${body || `<tr><td colspan="${cols.length}" class="dim">${opts.empty || 'Nothing matches these filters.'}</td></tr>`}</tbody></table></div>`;
}
const grpLabel = (name, meta) => `${esc(name)}${meta ? `<small>${esc(meta)}</small>` : ''}`;
function bindList(st, extra) { // filters, reset, sortable headers, segmented controls (data-k / data-v) on the page
  const c = $('#content');
  c.querySelectorAll('.fbar').forEach(bar => bar.addEventListener('click', ev => {
    if (ev.target.closest('[data-reset]')) { st.off = {}; st.sort = st._defaults.sort; P._fopen = null; saveFS(); route(); return; }
    const b = ev.target.closest('.fbtn[data-open]'); if (b) { P._fopen = P._fopen === b.dataset.g ? null : b.dataset.g; route(); return; }
    const ch = ev.target.closest('.fopt[data-g]'); if (!ch) return; const g = ch.dataset.g, v = ch.dataset.v; const G = (P._groups || []).find(x => x.k === g); if (!G) return;
    const hide = (sel) => { st.off[g] = G._all.filter(x => !sel.includes(x)); };
    if (v === '*') st.off[g] = G._isAll ? G._all.slice() : [];
    else if (ev.target.closest('[data-only]') || ev.altKey) hide([v]);
    else { const cur = G._sel.slice(); const i = cur.indexOf(v); if (i >= 0) cur.splice(i, 1); else cur.push(v); hide(cur); }
    saveFS(); route();
  }));
  c.querySelectorAll('th.sortable').forEach(th => th.addEventListener('click', () => { const k = th.dataset.k; st.sort = st.sort && st.sort.k === k ? { k, d: st.sort.d === 'asc' ? 'desc' : 'asc' } : { k, d: th.dataset.d || 'asc' }; saveFS(); route(); }));
  c.querySelectorAll('.seg.modes').forEach(m => m.addEventListener('click', ev => { const ch = ev.target.closest('[data-k]'); if (!ch) return; st[ch.dataset.k] = ch.dataset.v; saveFS(); route(); }));
  if (extra) extra();
}
document.addEventListener('click', ev => { if (P._fopen && !ev.target.closest('.fgrp')) { P._fopen = null; route(); } }); // a click outside closes a filter
// a segmented control bound to a state key: options [[value, label, count?]]
const segOf = (st, k, options, extraCls) => `<span class="seg modes ${extraCls || ''}">${options.map(([v, l, n]) => `<button type="button" data-k="${k}" data-v="${esc(v)}" aria-pressed="${st[k] === v}" class="${n === 0 ? 'zero' : ''}">${esc(l)}${n != null ? `<small>${n}</small>` : ''}</button>`).join('')}</span>`;

// ---------- tasks ----------
const P = {};
const taskMap = new Map(D.tasks.map(t=>[t.id,t]));

  const out = [`added ${md(t.added || t.date)}`];
  if (t.status==='done' || t.status==='cancelled') out.push(t.done ? `${t.status} ${md(t.done)}${t.days!=null?` (${t.days}d)`:''}` : t.doneUnknown ? `${t.status}, date unknown` : t.status);
  return out.join(' · '); };
const taskPeople = (t) => t.people.filter(id => id !== t.waiting && !t.textHtml.includes(`#/person/${id}"`));
function taskRow(t, opts={}) {

  return `<div class="task-row ${NATIVE?'editable':''} ${t.status==='done'||t.status==='cancelled'?'done':''}" ${click}>${taskBox(t)}<span class="tt"><span>${t.textHtml}</span><span class="tm2">${meta.join(' · ')}</span></span>${opts.showPri ? priHtml(t.priority) : ''}</div>`;
}
const taskAddBtn = (prefill, label) => NATIVE ? `<button type="button" class="btn sm" data-tadd="${esc(JSON.stringify(prefill||{}))}" title="New task (N)">${esc(label || 'Add task')}</button>` : '';
// task editing: one message to the app, which rewrites that line in the vault file and rebuilds
const taskSend = (req, note) => nativeSend({ task: req }, note);
const taskReq = (t, change) => Object.assign({ op: 'edit', file: t.file, raw: t.raw }, change);
function taskToggle(id) { const t = taskMap.get(id); if (!t) return; taskSend(taskReq(t, { status: isOpen(t) ? 'done' : 'open' }), isOpen(t) ? 'Done' : 'Reopened'); }
const PROJ_STATUS_ORDER = ['active', 'paused', 'idea', 'done', 'archived'];
const ordIdx = (o, v) => { const i = o.indexOf(v); return v ? (i < 0 ? 50 : i) : 99; };
function taskEditor(t, prefill) { // t = existing task, or null + prefill {project, people[]} for a new one

                : Object.assign({ text: '', status: 'open', priority: '', due: '', project: '', waiting: '', people: [] }, prefill || {});
  const v = JSON.parse(JSON.stringify(cur));
  const projs = D.projects.slice().sort((a, b) => ordIdx(PROJ_STATUS_ORDER, a.status) - ordIdx(PROJ_STATUS_ORDER, b.status) || a.name.localeCompare(b.name));
  const opt = (val, label, on) => `<option value="${esc(val)}" ${on?'selected':''}>${esc(label)}</option>`;
  const ppl = D.people.map(p => p.name);
  const seg = (k, options) => `<span class="seg" data-seg="${k}">${options.map(([val, l, tip]) => `<button type="button" data-v="${val}" aria-pressed="${v[k]===val}"${tip?` title="${esc(tip)}"`:''}>${l}</button>`).join('')}</span>`;
  const m = document.createElement('div'); m.className = 'tmodal'; m.id = 'tmodal';
  const draw = () => { m.innerHTML = `<div class="tform" role="dialog" aria-label="${t ? 'Edit task' : 'New task'}">
    <div class="hd"><h2>${t ? 'Edit task' : 'New task'}</h2>${t ? `<a href="${taskSrc(t)}" data-src="1">${t.entry ? 'In log ' + md(t.date) : 'On ' + esc(projName(t.source))} →</a>` : `<span class="hint" style="margin:0">Goes into today's log</span>`}</div>
    <textarea id="tf-text" class="tin" rows="2" placeholder="What has to happen? Link people with [[Name]]">${esc(v.text)}</textarea>

// ---------- editor: the whole markdown file; the app reads and writes it (readNote / saveNote in build.js) ----------
// A draft is kept in sessionStorage while typing, so a reload never loses it. Saving is refused when the file changed since it
// was opened (Obsidian, a sync, a task tick): load that version, or overwrite.
const viewOf = (file) => { // the hub page that shows this file
  for (const [type, list, key] of [['person', D.people, 'file'], ['project', D.projects, 'file'], ['doc', D.docs, 'file'], ['day', D.days, 'file'], ['asset', D.assets, 'sidecar']]) { const x = list.find(y => y[key] === file); if (x) return `#/${type}/${x.id}`; }
  return file === 'README.md' ? '#/readme' : '#/today'; };
const ED = {}; // the open editor: {file, base (text as opened), from (hash to return to)}
const draftKey = (f) => 'ycos.draft:' + f;
P.edit = (file) => {
  const x = viewOf(file); const m = x.match(/^#\/(\w+)\/(.+)$/); const it = m && by[m[1]] && by[m[1]].get(m[2]);
  const name = it ? (it.name || it.date) : file.replace(/^.*\//, '').replace(/\.md$/, '');
  if (ED.file !== file) { ED.file = file; ED.base = null; ED.from = P._lastHash && !P._lastHash.startsWith('#/edit/') ? P._lastHash : ''; }
  return { title: 'Edit · ' + name, crumbs: [[name, x]], h1: esc(name), sub: `Editing <code>${esc(file)}</code>`,
    acts: `<span class="estate" id="ed-state">Loading…</span><a class="btn" href="${obs(file)}" data-ext="1" title="Open in Obsidian instead">Obsidian</a><button class="btn" type="button" id="ed-cancel" title="Esc">Cancel</button><button class="btn primary" type="button" id="ed-save" title="⌘S" disabled>Save</button>`,
    html: `<div class="editor"><div id="ed-conflict"></div><textarea id="ed" spellcheck="true" disabled placeholder="Loading…"></textarea>
      <p class="hint"><span class="kbd">⌘S</span> save · <span class="kbd">Esc</span> cancel · <span class="kbd">Tab</span> / <span class="kbd">⇧Tab</span> indent a list line · <span class="kbd">Enter</span> continues a bullet or task · links as <code>[[Name]]</code>${NATIVE ? '' : ' · Saving works in the app only'}</p></div>`,
    after: () => editorBind(file) };
};
function editorBind(file) {
  const ta = $('#ed'), state = $('#ed-state'), saveBtn = $('#ed-save');
  const dirty = () => ED.base != null && ta.value !== ED.base;
  const mark = () => { const d = dirty(); state.textContent = d ? 'Unsaved changes' : 'Saved'; state.className = 'estate' + (d ? ' dirty' : ''); saveBtn.disabled = !d || !NATIVE; try { if (d) sessionStorage.setItem(draftKey(file), JSON.stringify({ base: ED.base, text: ta.value })); else sessionStorage.removeItem(draftKey(file)); } catch (e) {} };
  window.ycEditLoaded = (r) => {
    if (!r || r.file !== file || !$('#ed')) return;
    if (!r.ok) { state.textContent = r.error; state.className = 'estate err'; return; }
    ED.base = r.text; let text = r.text, restored = false;
    try { const dr = JSON.parse(sessionStorage.getItem(draftKey(file)) || 'null'); if (dr && dr.base === r.text && dr.text !== r.text) { text = dr.text; restored = true; } } catch (e) {}
    ta.value = text; ta.disabled = false; ta.placeholder = ''; mark(); if (restored) state.textContent = 'Unsaved changes (restored)';
    ta.focus(); const fm = text.match(/^---\n[\s\S]*?\n---\n*/); const pos = fm ? fm[0].length : 0; ta.setSelectionRange(pos, pos); ta.scrollTop = 0; window.scrollTo(0, 0);
  };
  window.ycEditSaved = (r) => {
    if (!r || r.file !== file) return;
    if (r.ok) { try { sessionStorage.removeItem(draftKey(file)); } catch (e) {} ED.base = ta.value; state.textContent = 'Saved'; leave(true); return; }
    state.textContent = 'Not saved'; state.className = 'estate err';
    $('#ed-conflict').innerHTML = `<div class="conflict"><span>${esc(r.error)}${r.conflict ? ' Your text is still here.' : ''}</span>${r.conflict ? '<button class="btn" type="button" data-ed="reload">Load their version</button><button class="btn danger" type="button" data-ed="force">Overwrite with mine</button>' : ''}</div>`;
  };
  const save = (force) => { if (!NATIVE || ED.base == null || (!dirty() && !force)) return; state.textContent = 'Saving…'; state.className = 'estate'; $('#ed-conflict').innerHTML = ''; NATIVE.postMessage({ save: { file, text: ta.value, base: ED.base, force: !!force } }); };
  const leave = (saved) => { // back to where the editor was opened from (or the note's own page); a save rebuilds the hub there
    const to = ED.from || viewOf(file); const back = ED.from && history.length > 1; ED.file = null; ED.base = null;
    if (NATIVE) { NATIVE.postMessage({ editing: false }); if (saved) window.addEventListener('hashchange', () => NATIVE.postMessage({ rebuild: true }), { once: true }); } // rebuild once the page has left #/edit
    if (back) history.back(); else location.replace(to);
  };
  let armed = 0;
  $('#ed-cancel').addEventListener('click', () => { if (dirty() && Date.now() - armed > 4000) { armed = Date.now(); $('#ed-cancel').textContent = 'Discard changes?'; $('#ed-cancel').classList.add('danger', 'armed'); return; } try { sessionStorage.removeItem(draftKey(file)); } catch (e) {} leave(false); });
  saveBtn.addEventListener('click', () => save(false));
  $('#ed-conflict').addEventListener('click', ev => { const b = ev.target.closest('[data-ed]'); if (!b) return; if (b.dataset.ed === 'force') save(true); else { try { sessionStorage.removeItem(draftKey(file)); } catch (e) {} $('#ed-conflict').innerHTML = ''; ta.disabled = true; state.textContent = 'Loading…'; NATIVE.postMessage({ read: { file } }); } });
  ta.addEventListener('input', mark);
  ta.addEventListener('keydown', ev => {
    if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 's') { ev.preventDefault(); save(false); return; }
    if (ev.key === 'Escape') { ev.preventDefault(); $('#ed-cancel').click(); return; }
    const v = ta.value, a = ta.selectionStart, b = ta.selectionEnd;
    const lineStart = v.lastIndexOf('\n', a - 1) + 1, lineEnd = (() => { const i = v.indexOf('\n', b); return i < 0 ? v.length : i; })();
    const put = (from, to, text, selA, selB) => { ta.setSelectionRange(from, to); if (!document.execCommand('insertText', false, text)) ta.setRangeText(text, from, to, 'end'); ta.setSelectionRange(selA, selB); mark(); };
    if (ev.key === 'Tab') { // indent / outdent the selected lines (or the list line the cursor is on); otherwise a tab character
      ev.preventDefault(); const block = v.slice(lineStart, lineEnd); const multi = block.includes('\n'); const isList = /^\s*([-*+]|\d+[.)])\s/.test(block);
      if (!ev.shiftKey && !multi && !isList) { put(a, b, '\t', a + 1, a + 1); return; }
      const lines = block.split('\n'); let firstDelta = 0, total = 0;
      const out = lines.map((l, i) => { let n; if (ev.shiftKey) { const mm = l.match(/^(\t| {1,4})/); n = mm ? l.slice(mm[0].length) : l; } else n = '\t' + l; const d = n.length - l.length; if (i === 0) firstDelta = d; total += d; return n; });
      put(lineStart, lineEnd, out.join('\n'), Math.max(lineStart, a + firstDelta), b + total); return;
    }
    if (ev.key === 'Enter' && !ev.shiftKey && !ev.metaKey && !ev.ctrlKey && !ev.altKey && a === b) { // continue a bullet / task / numbered line; an empty one ends the list
      const line = v.slice(lineStart, a); const mm = line.match(/^(\s*)([-*+]|\d+)([.)]?)(\s+)(\[[ xX\/\-]\]\s+)?(.*)$/); if (!mm || (!mm[3] && /\d/.test(mm[2]))) return;
      ev.preventDefault();
      if (!mm[6].trim() && a === lineEnd) { put(lineStart, a, '', lineStart, lineStart); return; }
      const marker = /\d/.test(mm[2]) ? (+mm[2] + 1) + mm[3] : mm[2]; const next = '\n' + mm[1] + marker + mm[4] + (mm[5] ? '[ ] ' : '');
      put(a, a, next, a + next.length, a + next.length);
    }
  });
  if (NATIVE) NATIVE.postMessage({ read: { file } });
  else fetch('../' + file.split('/').map(encodeURIComponent).join('/')).then(r => r.ok ? r.text() : Promise.reject(new Error(r.status))).then(text => window.ycEditLoaded({ ok: true, file, text }), e => window.ycEditLoaded({ ok: false, file, error: 'Cannot read ' + file + ' outside the app (' + e.message + ')' }));
}

// ---------- router: one header for every page, then the body (two columns when the page has a facts panel) ----------
const NAVOF = { day:'journal', project:'projects', person:'people', doc:'library', asset:'assets', repo:'repos', readme:'settings' };
function route() {
  const hash = location.hash.replace(/^#\/?/, '') || 'today'; const [page, ...rest] = hash.split('/'); const id = decodeURIComponent(rest.join('/'));
  if (page === 'doc') { const d = by.doc.get(id); if (d && d.open && !d.bodyHtml) {
    // HTML document: leave the hub on the page we came from (not on #/doc/…, which would redirect again on Back), then open the file
    history.replaceState(null, '', P._lastHash || '#/library'); location.href = fileHref(d.open); return; } }
  if (page !== 'edit' && ED.file) { ED.file = null; ED.base = null; if (NATIVE) NATIVE.postMessage({ editing: false }); }
  const fn = P[page] || P.today; const r = fn(id);
  const navKey = page === 'edit' ? NAVOF[(viewOf(id).match(/^#\/(\w+)/) || [])[1]] || '' : NAVOF[page] || page;
  renderNav(navKey); document.title = r.title ? `${r.title} · ${APP}` : APP;
  const cr = r.crumbs || []; $('#crumbs').hidden = !cr.length;
  $('#crumbs').innerHTML = cr.map(([l, href]) => `<a href="${href}">${esc(l)}</a>`).join('<span class="sep">/</span>');
  $('#h1').innerHTML = r.h1 || esc(r.title); $('#sub').innerHTML = r.sub || ''; $('#acts').innerHTML = r.acts || '';
  $('#content').innerHTML = r.aside != null ? `<div class="detail"><div class="col">${r.html}</div><aside class="facts">${r.aside}</aside></div>` : r.html;
  if (r.after) r.after();
  const same = P._lastHash === location.hash; if (!same) P._fopen = null; P._lastHash = location.hash;
  if (!same) window.scrollTo(0, 0); // filters re-render the same page without jumping
}
window.addEventListener('hashchange', route);

// ---------- search ----------
const idx = [
  ...D.days.map(d=>({type:'day',id:d.id,name:fmtDate(d.date),sub:d.entries.map(e=>e.title).join(' · '),text:d.text,date:d.date})),
  ...D.people.map(p=>({type:'person',id:p.id,name:p.name,sub:[p.role,p.organization].filter(Boolean).join(' · '),text:p.text,date:p.lastContact})),
  ...D.projects.map(p=>({type:'project',id:p.id,name:p.name,sub:p.description,text:p.text,date:p.lastActivity})),
  ...D.docs.map(d=>({type:'doc',id:d.id,name:d.name,sub:d.category+(d.project?' · '+projName(d.project):''),text:(d.text||'')+' '+d.file,date:d.edited})),
  ...(D.repos||[]).map(r=>({type:'repo',id:r.id,name:r.name,sub:[r.owner,r.host].filter(Boolean).join(' · ')+(r.description?' — '+r.description:''),text:r.description+' '+r.url+' '+r.home,date:r.lastDate})),
  ...D.assets.map(a=>({type:'asset',id:a.id,name:a.name,sub:a.added+' · '+a.ext,text:(a.text||'')+' '+a.file,date:a.added||a.edited})),
  ...D.tasks.map(t=>({type:'task',id:t.id,name:t.search,sub:[t.project?projName(t.project):'', t.status, t.priority].filter(Boolean).join(' · '),text:t.search,date:t.date,day:t.date,src:t.source})),
  ...[...entries.values()].map(e=>({type:'entry',id:e.id,name:e.title,sub:[e.date, e.projectName, e.category].filter(Boolean).join(' · '),text:e.text,date:e.date,day:e.date})),
];
const TYPE_L = { day:'Day', person:'Person', project:'Project', doc:'Library', repo:'Repo', asset:'Asset', task:'Task', entry:'Log' };
const q = $('#q'), res = $('#results'); let sel = 0, hits = [];
function search(s) {
  s = s.trim().toLowerCase(); if (!s) { res.classList.remove('open'); res.innerHTML=''; hits=[]; return; }
  const terms = s.split(/\s+/);
  hits = idx.map(it => { const n = it.name.toLowerCase(), sub=(it.sub||'').toLowerCase(), t=(it.text||'').toLowerCase(); let score=0;
    for (const term of terms) { if (n===term) score+=50; else if (n.startsWith(term)) score+=25; else if (n.includes(term)) score+=15; else if (sub.includes(term)) score+=8; else if (t.includes(term)) score+=3; else return null; }
    return {it, score}; }).filter(Boolean).sort((a,b)=>b.score-a.score||(b.it.date||'').localeCompare(a.it.date||'')).slice(0,30).map(x=>x.it);
  sel = 0; render();
  function render() {
    res.innerHTML = hits.length ? hits.map((it,i)=>{ const href = it.type==='entry' ? `#/day/${it.day}` : it.type==='task' ? (it.src ? `#/project/${it.src}` : `#/day/${it.day}`) : `#/${it.type}/${it.id}`; const snippet = snip(it, terms);
      return `<a href="${href}" class="${i===sel?'sel':''}"><span class="t">${TYPE_L[it.type]||it.type}</span><span class="n">${esc(it.name)}</span><span class="d">${it.date||''}</span>${snippet?`<span class="s">${snippet}</span>`:''}</a>`; }).join('') : '<div class="none">No results</div>';
    res.classList.add('open');
  }
}
function snip(it, terms) { const t = it.text||''; const lt=t.toLowerCase(); let pos=-1; for (const term of terms) { pos = lt.indexOf(term); if (pos>=0) break; } const base = it.sub ? esc(it.sub) : ''; if (pos<0) return base; const s = Math.max(0,pos-40); return (base?base+' — ':'') + (s>0?'…':'') + esc(t.slice(s,pos+80)); }
q.addEventListener('input', () => search(q.value));
q.addEventListener('focus', () => { if (q.value) search(q.value); });
q.addEventListener('keydown', (ev) => {
  const rows = [...res.querySelectorAll('a')];
  if (ev.key==='ArrowDown') { sel=Math.min(sel+1,hits.length-1); ev.preventDefault(); search(q.value); [...res.querySelectorAll('a')][sel]?.scrollIntoView({block:'nearest'}); }
  else if (ev.key==='ArrowUp') { sel=Math.max(sel-1,0); ev.preventDefault(); search(q.value); }
  else if (ev.key==='Enter') { const a=rows[sel]; if (a) { location.hash=a.getAttribute('href'); q.blur(); res.classList.remove('open'); } }
  else if (ev.key==='Escape') { q.blur(); res.classList.remove('open'); }
});
document.addEventListener('click', (ev) => { if (!ev.target.closest('.gsearch')) res.classList.remove('open'); });
res.addEventListener('click', () => { res.classList.remove('open'); q.blur(); });

// ---------- keys ----------
document.addEventListener('keydown', (ev) => {
  const typing = /input|textarea|select/i.test(document.activeElement.tagName);
  if ((ev.metaKey||ev.ctrlKey) && ev.key.toLowerCase()==='r') { ev.preventDefault(); if (ED.file) return; if (NATIVE) { keepScroll(); NATIVE.postMessage({ rebuild: true }); } else location.reload(); return; }
  if (typing && /^Arrow/.test(ev.key)) return; // ⌘← ⌘→ move the cursor while typing
  if ((ev.metaKey||ev.ctrlKey) && (ev.key==='[' || ev.key==='ArrowLeft')) { ev.preventDefault(); history.back(); return; }
  if ((ev.metaKey||ev.ctrlKey) && (ev.key===']' || ev.key==='ArrowRight')) { ev.preventDefault(); history.forward(); return; }
  if ((ev.metaKey||ev.ctrlKey) && ev.key.toLowerCase()==='k') { ev.preventDefault(); q.focus(); q.select(); return; }
  if (ev.key==='Escape' && P._fopen) { P._fopen = null; route(); return; }
  if (typing || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (NATIVE && (ev.key==='n' || ev.key==='N')) { ev.preventDefault(); const pg = location.hash.match(/^#\/(project|person)\/(.+)$/); const x = pg && by[pg[1]].get(decodeURIComponent(pg[2])); taskEditor(null, !x ? {} : pg[1] === 'project' ? { project: x.name } : { people: [x.name] }); return; }
  if (ev.key==='/') { ev.preventDefault(); q.focus(); q.select(); return; }
  if (ev.key==='e' || ev.key==='E') { const ed = document.querySelector('#acts [data-edit]'); if (ed) { ev.preventDefault(); ed.click(); } return; }
  if (location.hash.startsWith('#/day/')) { if (ev.key==='ArrowLeft' && P._dayPrev) location.hash = '#/day/' + P._dayPrev; if (ev.key==='ArrowRight' && P._dayNext) location.hash = '#/day/' + P._dayNext; }
});
// inside the app (WKWebView): external links, files and obsidian:// go to the Mac
document.addEventListener('click', (ev) => {
  const a = ev.target.closest('a'); if (!a || !NATIVE) return; const href = a.getAttribute('href') || '';
  if (/^(obsidian:|https?:|mailto:|tel:)/.test(href) || a.target === '_blank') { ev.preventDefault(); NATIVE.postMessage({ open: a.href }); }
});
window.addEventListener('focus', () => { if (NATIVE && !ED.file && Date.now() - (window.__lastFocusBuild||0) > 15000) { window.__lastFocusBuild = Date.now(); keepScroll(); NATIVE.postMessage({ rebuild: true }); } });
route();
// after a change the app reloads the page: come back to the same scroll position
try { const sp = JSON.parse(sessionStorage.getItem('ycos.scroll') || 'null'); sessionStorage.removeItem('ycos.scroll'); if (sp && sp.hash === location.hash) window.scrollTo(0, sp.y); } catch (e) {}
})();
</script>
